<!doctype html>
<meta charset="utf-8">
<title>Realm Atlas</title>
<!-- The New Realm, drawn at full size. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a10;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #7b8496; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  canvas.drag { cursor: grabbing; }
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 7px 12px;
    display: flex; gap: 20px; align-items: baseline;
    background: linear-gradient(rgba(7,10,16,0), rgba(7,10,16,.92) 55%);
    pointer-events: none;
  }
  #where { color: #b9c2d4; }
  #hint { margin-left: auto; opacity: .5; }

  /* The panel a zone opens into. */
  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 296px;
    background: rgba(10,13,20,.94); border-left: 1px solid rgba(255,255,255,.09);
    padding: 16px 16px 22px; overflow-y: auto;
    transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.7,.3,1);
  }
  #panel.is-open { transform: none; }
  #panel h2 { margin: 0; font-size: 1.05rem; color: #e6ecf7; }
  #panel .sub { margin: 3px 0 14px; font-size: .78em; opacity: .55; }
  #panel .shut {
    position: absolute; top: 12px; right: 12px; width: 24px; height: 24px;
    border-radius: 6px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: inherit; cursor: pointer; font: inherit;
  }
  #panel h3 { margin: 16px 0 7px; font-size: .7rem; letter-spacing: .12em;
    text-transform: uppercase; color: #ffcb70; opacity: .8; }
  .life { display: grid; gap: 6px; }
  .life div { display: flex; gap: 10px; align-items: center; }
  .life b { font-weight: 500; color: #cdd6e5; font-size: .85em; }
  .life em { margin-left: auto; font-style: normal; opacity: .4; font-size: .75em; }
  .art { image-rendering: pixelated; background-repeat: no-repeat; flex: none; }
  .art.runs { animation: run var(--time) steps(var(--steps)) infinite; }
  @keyframes run { from { background-position-x: 0; } to { background-position-x: calc(-1 * var(--w)); } }
  .facts { display: grid; gap: 3px; font-size: .8em; }
  .facts span { display: flex; justify-content: space-between; }
  .facts i { font-style: normal; opacity: .5; }
  @media (prefers-reduced-motion: reduce) { .art.runs { animation: none; } }
</style>

</div>

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d', { alpha: false });
const whereAt = document.getElementById('where');
const zoneAt = document.getElementById('zone');
const countAt = document.getElementById('count');
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');

const B = A.bounds;
const view = { x: (B.minX + B.maxX) / 2, y: (B.minY + B.maxY) / 2, scale: 0.4 };
const want = { x: view.x, y: view.y, scale: view.scale };
let pointer = null, hovered = 0, chosen = 0;

const zoneById = new Map(A.zones.map(z => [z.id, z]));

function size() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(canvas.clientWidth * dpr);
  canvas.height = Math.round(canvas.clientHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: canvas.clientWidth, h: canvas.clientHeight };
}
const toScreen = (tx, ty, box) => ({
  x: (tx - view.x) * view.scale + box.w / 2,
  y: (ty - view.y) * view.scale + box.h / 2
});
const toTile = (px, py, box) => ({
  x: (px - box.w / 2) / view.scale + view.x,
  y: (py - box.h / 2) / view.scale + view.y
});

/* ---------------- the pyramid ---------------- */
const images = new Map();
function chunkImage(z, name) {
  const key = z + '/' + name;
  let img = images.get(key);
  if (img !== undefined) return img;
  img = new Image();
  img.decoding = 'async';
  img.src = BASE + 'z' + z + '/' + name + '.png';
  images.set(key, img);
  return img;
}
const haveChunk = new Map();
for (const level of A.levels) haveChunk.set(level.z, new Set(level.chunks));

// The level whose pixels come closest to the screen's.
function levelFor(scale) {
  const wanted = Math.log2(A.px / Math.max(scale, 1e-6));
  return Math.max(0, Math.min(A.levels.length - 1, Math.round(wanted)));
}

function drawGround(box) {
  const z = levelFor(view.scale);
  const have = haveChunk.get(z);
  const span = A.chunk * (1 << z);
  const near = toTile(0, 0, box), far = toTile(box.w, box.h, box);
  const c0 = Math.floor(near.x / span), c1 = Math.floor(far.x / span);
  const r0 = Math.floor(near.y / span), r1 = Math.floor(far.y / span);
  const on = span * view.scale;
  ctx.imageSmoothingEnabled = view.scale < A.px / 2;
  let drawn = 0;
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const name = c + '_' + r;
      if (!have.has(name)) continue;
      const img = chunkImage(z, name);
      if (!img.complete || !img.naturalWidth) continue;
      const at = toScreen(c * span, r * span, box);
      ctx.drawImage(img, at.x, at.y, on + 1, on + 1);
      drawn++;
    }
  }
  return { z, drawn };
}

/* ---------------- the mask, read once ---------------- */
let mask = null;
const maskImage = new Image();
maskImage.onload = () => {
  const off = document.createElement('canvas');
  off.width = maskImage.width; off.height = maskImage.height;
  const o = off.getContext('2d', { willReadFrequently: true });
  o.drawImage(maskImage, 0, 0);
  mask = { w: off.width, h: off.height, data: o.getImageData(0, 0, off.width, off.height).data };
  populate();
};
maskImage.src = BASE + 'mask.png';

function atTile(tx, ty) {
  if (!mask) return null;
  const x = Math.floor(tx) - B.minX, y = Math.floor(ty) - B.minY;
  if (x < 0 || y < 0 || x >= mask.w || y >= mask.h) return null;
  const at = (y * mask.w + x) * 4;
  return { biome: mask.data[at], road: mask.data[at + 1] > 0, zone: mask.data[at + 2] };
}
const zoneOf = (tx, ty) => { const t = atTile(tx, ty); return t ? t.zone : 0; };

const roads = new Image();
roads.src = BASE + 'roads.png';

/*
 * A zone lit up.
 *
 * Drawn once into a canvas the size of the patch and kept, because a patch of
 * two hundred thousand tiles is not something to walk over every frame. What
 * comes back is a white silhouette to be laid over the ground at a low
 * opacity - enough to say "this, and this much of it" without hiding what is
 * underneath.
 */
const lit = new Map();
function litZone(id) {
  if (lit.has(id)) return lit.get(id);
  const zone = zoneById.get(id);
  if (!zone || !mask) return null;
  const [x0, y0, x1, y1] = zone.box;
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const o = off.getContext('2d');
  const out = o.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const from = ((y + y0 - B.minY) * mask.w + (x + x0 - B.minX)) * 4;
      if (mask.data[from + 2] !== id) continue;
      const to = (y * w + x) * 4;
      out.data[to] = 255; out.data[to + 1] = 236; out.data[to + 2] = 190; out.data[to + 3] = 255;
    }
  }
  o.putImageData(out, 0, 0);
  const made = { canvas: off, x: x0, y: y0, w, h };
  lit.set(id, made);
  return made;
}

function drawLit(box, id, alpha) {
  const made = litZone(id);
  if (!made) return;
  const at = toScreen(made.x, made.y, box);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha;
  ctx.imageSmoothingEnabled = view.scale < 2;
  ctx.drawImage(made.canvas, at.x, at.y, made.w * view.scale, made.h * view.scale);
  ctx.restore();
}

/* ---------------- what lives there ---------------- */
/*
 * One creature to about twelve hundred tiles of its own patch, floored and
 * capped so a small zone is not empty and a vast one is not a swarm. They are
 * placed by sampling inside the patch's own bounds rather than the whole map,
 * which is what makes placing a thousand of them instant.
 */
const perZone = area => Math.max(4, Math.min(90, Math.round(area / 1200)));
const alive = [];
const lifeArt = new Map();

function artFor(sprite) {
  let img = lifeArt.get(sprite.file);
  if (!img) {
    img = new Image();
    img.decoding = 'async';
    img.src = BASE + 'life/' + sprite.file;
    lifeArt.set(sprite.file, img);
  }
  return img;
}

function populate() {
  alive.length = 0;
  for (const zone of A.zones) {
    if (!zone.lives || !zone.lives.length) continue;
    const [x0, y0, x1, y1] = zone.box;
    const wanted = perZone(zone.tiles);
    let placed = 0, tries = 0;
    while (placed < wanted && tries < wanted * 60) {
      tries++;
      const x = x0 + Math.random() * (x1 - x0 + 1);
      const y = y0 + Math.random() * (y1 - y0 + 1);
      if (zoneOf(x, y) !== zone.id) continue;
      const kind = zone.lives[Math.floor(Math.random() * zone.lives.length)];
      const angle = Math.random() * Math.PI * 2;
      alive.push({
        kind, home: zone.id, x, y,
        vx: Math.cos(angle) * 0.5, vy: Math.sin(angle) * 0.5,
        phase: Math.random() * 100
      });
      placed++;
    }
  }
  countAt.textContent = alive.length + ' creatures across ' + A.zones.length + ' zones';
}

function stepLife(delta) {
  for (const one of alive) {
    one.phase += delta;
    const turn = (Math.random() - 0.5) * 0.4 * delta;
    const cos = Math.cos(turn), sin = Math.sin(turn);
    const vx = one.vx * cos - one.vy * sin;
    const vy = one.vx * sin + one.vy * cos;
    one.vx = vx; one.vy = vy;
    const nx = one.x + vx * delta, ny = one.y + vy * delta;
    // Its own patch or nowhere. Not its biome - its patch.
    if (zoneOf(nx, ny) === one.home) { one.x = nx; one.y = ny; continue; }
    if (zoneOf(nx, one.y) === one.home) { one.x = nx; one.vy = -one.vy; }
    else if (zoneOf(one.x, ny) === one.home) { one.y = ny; one.vx = -one.vx; }
    else { one.vx = -one.vx; one.vy = -one.vy; }
  }
}

const SHOW_LIFE = 1.4;
function drawLife(box) {
  if (view.scale < SHOW_LIFE) return 0;
  const fade = Math.min(1, (view.scale - SHOW_LIFE) / 1.2);
  const near = toTile(-60, -60, box), far = toTile(box.w + 60, box.h + 60, box);
  ctx.globalAlpha = fade;
  ctx.imageSmoothingEnabled = false;
  let drawn = 0;
  for (const one of alive) {
    if (one.x < near.x || one.x > far.x || one.y < near.y || one.y > far.y) continue;
    const img = artFor(one.kind.sprite);
    if (!img.complete || !img.naturalWidth) continue;
    const sprite = one.kind.sprite;
    const frame = sprite.frames > 1 ? Math.floor(one.phase * 4) % sprite.frames : 0;
    const wide = (sprite.tile / A.px) * view.scale * 1.5;
    const tall = (sprite.height / A.px) * view.scale * 1.5;
    const at = toScreen(one.x, one.y, box);
    ctx.drawImage(img, frame * sprite.tile, 0, sprite.tile, sprite.height,
      at.x - wide / 2, at.y - tall + view.scale / 2, wide, tall);
    drawn++;
  }
  ctx.globalAlpha = 1;
  return drawn;
}

/* ---------------- roads and beacons, quietly ---------------- */
function drawRoads(box) {
  if (!roads.complete || !roads.naturalWidth || !mask) return;
  const at = toScreen(B.minX, B.minY, box);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.12;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(roads, at.x, at.y, mask.w * view.scale, mask.h * view.scale);
  ctx.restore();
}

function drawBeacons(box, time) {
  const pulse = 1 + Math.sin(time / 620) * 0.13;
  const r = Math.max(3.5, Math.min(10, view.scale * 2));
  ctx.lineWidth = 1.2;
  for (const beacon of A.beacons) {
    const at = toScreen(beacon.x, beacon.y, box);
    if (at.x < -30 || at.y < -30 || at.x > box.w + 30 || at.y > box.h + 30) continue;
    ctx.globalAlpha = 0.24;
    ctx.strokeStyle = '#8ff0ff';
    ctx.beginPath(); ctx.arc(at.x, at.y, r * 1.9 * pulse, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = beacon === chosenBeacon ? 'rgba(70,52,20,.9)' : 'rgba(20,34,44,.8)';
    ctx.strokeStyle = beacon === chosenBeacon ? '#ffcb70' : '#8ff0ff';
    ctx.beginPath(); ctx.arc(at.x, at.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

/* ---------------- names of places ---------------- */
/*
 * Nothing is labelled until it is asked about.
 *
 * A hundred names scattered over the ground is a legend printed on the map,
 * and it hides the thing it describes - which here is the realm itself, drawn
 * tile for tile. So only the patch under the pointer, or the one that has been
 * opened, is named, and it is named where it is rather than in a list.
 */
function drawNames(box) {
  if (chosenBeacon) {
    const at = toScreen(chosenBeacon.x, chosenBeacon.y, box);
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.font = '600 13px ui-monospace, Consolas, monospace';
    ctx.globalAlpha = 0.6; ctx.lineWidth = 4; ctx.strokeStyle = '#05080d';
    ctx.strokeText(chosenBeacon.name, at.x, at.y - 14);
    ctx.globalAlpha = 1; ctx.fillStyle = '#ffe6b0';
    ctx.fillText(chosenBeacon.name, at.x, at.y - 14);
    return;
  }
  const show = chosen || hovered;
  if (!show) return;
  const zone = zoneById.get(show);
  if (!zone) return;
  const at = toScreen(zone.at[0], zone.at[1], box);
  if (at.x < 0 || at.y < 0 || at.x > box.w || at.y > box.h) return;
  const scale = Math.max(13, Math.min(22, Math.sqrt(zone.tiles) * view.scale * 0.06));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 ' + scale.toFixed(0) + 'px ui-monospace, Consolas, monospace';
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 4; ctx.strokeStyle = '#05080d';
  ctx.strokeText(zone.name, at.x, at.y);
  ctx.globalAlpha = 1;
  ctx.fillStyle = show === chosen ? '#ffe6b0' : '#e8eef8';
  ctx.fillText(zone.name, at.x, at.y);
}

/* ---------------- the panel ---------------- */
/*
 * A row of creatures with their pictures, used by both panels.
 */
function livesList(list) {
  if (!list || !list.length) return '<p class="sub">Nothing was met here.</p>';
  return '<div class="life">' + list.map(one => {
    const s = one.sprite;
    const k = Math.max(2, Math.min(6, Math.round(30 / s.height)));
    const style = 'width:' + (s.tile * k) + 'px;height:' + (s.height * k) + 'px;'
      + 'background-image:url(' + BASE + 'life/' + s.file + ');'
      + 'background-size:' + (s.tile * s.frames * k) + 'px 100%;'
      + '--w:' + (s.tile * s.frames * k) + 'px;--steps:' + s.frames + ';'
      + '--time:' + (s.frames * 0.24).toFixed(2) + 's';
    return '<div><span class="art' + (s.frames > 1 ? ' runs' : '') + '" style="' + style + '"></span>'
      + '<b>' + one.name + '</b><em>' + one.seen + '</em></div>';
  }).join('') + '</div>';
}

/*
 * A beacon is inside a place without being of it. It has its own guardian and
 * its own fight, and someone looking for one is not looking for the forest it
 * happens to stand in - so it answers to a click in its own right, and says
 * which place it is in rather than being swallowed by it.
 */
let chosenBeacon = null;
function openBeacon(beacon) {
  chosen = 0;
  chosenBeacon = beacon;
  const zone = zoneById.get(beacon.zone);
  panelBody.innerHTML = '<h2>' + beacon.name + ' Beacon</h2>'
    + '<p class="sub">' + beacon.state + ' · at ' + beacon.x + ', ' + beacon.y + '</p>'
    + '<div class="facts">'
    + '<span><i>standing in</i> ' + (zone ? zone.name : 'unclaimed ground') + '</span>'
    + '<span><i>guardians met</i> ' + (beacon.guards || []).length + '</span>'
    + '</div>'
    + '<h3>Around it</h3>' + livesList(beacon.guards);
  panel.classList.add('is-open');

  const box = size();
  want.x = beacon.x; want.y = beacon.y;
  want.scale = Math.max(view.scale, 3.2);
}

function openZone(id) {
  const zone = zoneById.get(id);
  if (!zone) return;
  chosen = id;
  chosenBeacon = null;
  const beacons = A.beacons.filter(b =>
    b.x >= zone.box[0] && b.x <= zone.box[2] && b.y >= zone.box[1] && b.y <= zone.box[3]).length;
  const wide = zone.box[2] - zone.box[0] + 1, tall = zone.box[3] - zone.box[1] + 1;

  panelBody.innerHTML = '<h2>' + zone.name + '</h2>'
    + '<p class="sub">' + zone.tiles.toLocaleString() + ' tiles · ' + wide + ' by ' + tall
    + ' · centred on ' + zone.at[0] + ', ' + zone.at[1] + '</p>'
    + '<div class="facts">'
    + '<span><i>beacons here</i> ' + beacons + '</span>'
    + '<span><i>creatures walking</i> ' + alive.filter(o => o.home === id).length + '</span>'
    + '<span><i>beacons here</i> ' + beacons + '</span>'.replace(/^.*$/, '')
    + (zone.named ? '' : '<span><i>this zone has no name yet</i> id ' + zone.id + '</span>')
    + '</div>'
    + (zone.madeOf && zone.madeOf.length
      ? '<h3>Ground</h3><div class="facts">' + zone.madeOf.map(part =>
        '<span><i>' + part.ground + '</i> ' + Math.round(100 * part.tiles / zone.tiles) + '%</span>'
      ).join('') + '</div>'
      : '')
    + '<h3>' + (zone.met ? 'Met here' : 'Expected here') + '</h3>' + livesList(zone.lives);
  panel.classList.add('is-open');

  // And go there: the patch fills the window with a little room round it.
  const box = size();
  want.x = (zone.box[0] + zone.box[2]) / 2;
  want.y = (zone.box[1] + zone.box[3]) / 2;
  want.scale = Math.max(0.05, Math.min(12,
    Math.min((box.w - 320) / wide, (box.h - 60) / tall) * 0.85));
}
function shutPanel() { chosen = 0; chosenBeacon = null; panel.classList.remove('is-open'); }
document.getElementById('shut').addEventListener('click', shutPanel);

/* ---------------- the frame ---------------- */
let last = performance.now();
function frame(now) {
  const delta = Math.min(0.1, (now - last) / 1000);
  last = now;
  // The view eases to where it was asked to go rather than jumping.
  for (const key of ['x', 'y', 'scale']) {
    view[key] += (want[key] - view[key]) * Math.min(1, delta * 7);
  }
  const box = size();
  ctx.fillStyle = '#070a10';
  ctx.fillRect(0, 0, box.w, box.h);

  const ground = drawGround(box);
  drawRoads(box);
  if (chosen) drawLit(box, chosen, 0.16);
  else if (hovered) drawLit(box, hovered, 0.1);
  stepLife(delta);
  const living = drawLife(box);
  drawBeacons(box, now);
  drawNames(box);

  if (pointer) {
    const t = toTile(pointer.x, pointer.y, box);
    const here = atTile(t.x, t.y);
    hovered = here ? here.zone : 0;
    const zone = zoneById.get(hovered);
    whereAt.textContent = 'tile ' + Math.floor(t.x) + ', ' + Math.floor(t.y)
      + '   z' + ground.z + '   ' + ground.drawn + ' chunks   ' + living + ' shown';
    zoneAt.textContent = zone ? zone.name : (here && here.biome === A.mask.sea ? 'open water' : '');
    canvas.style.cursor = zone ? 'pointer' : 'crosshair';
  }
  requestAnimationFrame(frame);
}

/* ---------------- getting about ---------------- */
function fit() {
  const box = size();
  want.scale = Math.min(box.w / (B.maxX - B.minX + 1), (box.h - 40) / (B.maxY - B.minY + 1)) * 0.95;
  want.x = (B.minX + B.maxX) / 2;
  want.y = (B.minY + B.maxY) / 2;
}
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  const box = size();
  const under = toTile(event.offsetX, event.offsetY, box);
  want.scale = view.scale = Math.max(0.05, Math.min(40,
    view.scale * (event.deltaY > 0 ? 1 / 1.22 : 1.22)));
  const after = toTile(event.offsetX, event.offsetY, box);
  view.x += under.x - after.x;
  view.y += under.y - after.y;
  want.x = view.x; want.y = view.y;
}, { passive: false });

let from = null, moved = 0;
canvas.addEventListener('pointerdown', event => {
  from = { x: event.offsetX, y: event.offsetY, vx: view.x, vy: view.y };
  moved = 0;
  canvas.classList.add('drag');
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  pointer = { x: event.offsetX, y: event.offsetY };
  if (!from) return;
  moved += Math.abs(event.movementX) + Math.abs(event.movementY);
  view.x = want.x = from.vx - (event.offsetX - from.x) / view.scale;
  view.y = want.y = from.vy - (event.offsetY - from.y) / view.scale;
});
canvas.addEventListener('pointerup', event => {
  canvas.classList.remove('drag');
  const dragged = moved > 5;
  from = null;
  if (dragged) return;
  // A click, not a drag: open what is under it, or close what is open.
  const box = size();
  const t = toTile(event.offsetX, event.offsetY, box);
  // A beacon is a smaller target than the ground under it, so it is tried
  // first, and with a margin that does not shrink to nothing when zoomed out.
  const reach = Math.max(9, Math.min(20, view.scale * 2.4));
  let near = null, best = reach * reach;
  for (const beacon of A.beacons) {
    const at = toScreen(beacon.x, beacon.y, box);
    const d = (at.x - event.offsetX) ** 2 + (at.y - event.offsetY) ** 2;
    if (d < best) { best = d; near = beacon; }
  }
  if (near) { openBeacon(near); return; }
  const zone = zoneOf(t.x, t.y);
  if (zone) openZone(zone); else shutPanel();
});
canvas.addEventListener('pointerleave', () => { pointer = null; hovered = 0; });
canvas.addEventListener('dblclick', () => { shutPanel(); fit(); });
addEventListener('resize', () => { if (!from) size(); });
addEventListener('keydown', event => { if (event.key === 'Escape') shutPanel(); });

fit();
view.scale = want.scale; view.x = want.x; view.y = want.y;
requestAnimationFrame(frame);
</script>
