<!doctype html>
<meta charset="utf-8">
<title>Realm Atlas</title>
<!-- The New Realm, drawn at full size. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a10;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #7b8496; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  canvas.drag { cursor: grabbing; }
  #seen i { font-style: normal; opacity: .55; }
  #seen b { font-weight: 600; color: #b9c4d8; }
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 7px 12px;
    display: flex; gap: 20px; align-items: baseline;
    background: linear-gradient(rgba(7,10,16,0), rgba(7,10,16,.92) 55%);
    pointer-events: none;
  }
  #where { color: #b9c2d4; }
  #hint { margin-left: auto; opacity: .5; }

  /* The panel a zone opens into. */
  #panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 372px; max-width: 86vw;
    background: rgba(9,12,19,.97); border-left: 1px solid rgba(255,255,255,.12);
    padding: 18px 18px 26px; overflow-y: auto; color: #cfd8e6;
    /* It scrolls; it does not advertise that it scrolls. A light bar down
       the edge of a dark panel is the brightest thing on the page. */
    scrollbar-width: none; -ms-overflow-style: none;
    transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.7,.3,1);
  }
  #panel::-webkit-scrollbar { width: 0; height: 0; }
  #panel.is-open { transform: none; }
  #panel h2 { margin: 0 28px 0 0; font-size: 1.18rem; color: #f2f6fc; letter-spacing: .01em; }
  #panel .sub { margin: 4px 0 14px; font-size: .8em; color: #8d9bb0; }
  /* The rank a realm gives the place, said the way the game says it. */
  .rank { display: inline-block; margin: 7px 0 0; padding: 2px 9px; border-radius: 999px;
    font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600;
    border: 1px solid currentColor; }
  .rank.rookie { color: #86d98e; } .rank.veteran { color: #7fbcf5; }
  .rank.seasonal { color: #c79bf0; } .rank.other { color: #ffcb70; }
  #panel .shut {
    position: absolute; top: 12px; right: 12px; width: 24px; height: 24px;
    border-radius: 6px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: inherit; cursor: pointer; font: inherit;
  }
  #panel h3 { margin: 20px 0 8px; font-size: .72rem; letter-spacing: .13em;
    text-transform: uppercase; color: #ffcb70;
    border-bottom: 1px solid rgba(255,203,112,.2); padding-bottom: 5px; }
  #panel h3 span { float: right; color: #7c8899; letter-spacing: 0; text-transform: none;
    font-weight: 400; }
  .life { display: grid; gap: 2px; }
  .life div { display: flex; gap: 11px; align-items: center;
    padding: 4px 6px; border-radius: 5px; }
  .life div:nth-child(odd) { background: rgba(255,255,255,.035); }
  .life b { font-weight: 500; color: #e3eaf5; font-size: .88em; }
  .life em { margin-left: auto; font-style: normal; color: #7c8899; font-size: .76em; }
  .life i { font-style: normal; color: #ffcb70; font-size: .68em; letter-spacing: .06em;
    text-transform: uppercase; margin-left: 8px; }
  /* An encounter or a hero: one picture, sized to the row. */
  .face { flex: none; width: 34px; height: 34px; object-fit: contain;
    image-rendering: pixelated; }
  /* How much of the floor is what. */
  /* Tiers of gear: the slot's own icon, and the run that falls here. */
  .tiers { margin: 4px 0 12px; }
  .tiers div { display: flex; align-items: center; gap: 9px; padding: 3px 0; }
  .tiers .slot { width: 18px; height: 18px; image-rendering: pixelated; flex: none; opacity: .85; }
  .tiers b { flex: 1; font-weight: 500; color: #9aa4ba; font-size: 11px; }
  .tiers em { font-style: normal; color: #d7c98a; font-size: 12px; letter-spacing: .3px; }
  .tiers em u { text-decoration: none; color: #6f7b90; padding: 0 2px; }
  .panel h4 { margin: 10px 0 5px; font-size: 10px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: #6f7b90; }
  .haul { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
    gap: 7px; margin-bottom: 10px; }
  .haul figure { margin: 0; text-align: center; }
  .haul img { width: 30px; height: 30px; object-fit: contain; image-rendering: pixelated; }
  .haul figcaption { font-size: 9px; line-height: 1.25; color: #8b96ab; margin-top: 2px;
    overflow-wrap: anywhere; }
  .drops { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 12px; }
  .drops span { font-size: 10px; padding: 2px 6px; border-radius: 9px;
    background: rgba(120,132,158,.14); color: #93a0b6; }
  .life u.stat { display: block; text-decoration: none; font-size: 10px; color: #6f7b90; }
  .soil { display: grid; gap: 5px; font-size: .8em; }
  .soil div { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .soil b { font-weight: 400; color: #c3ccdb; }
  .soil em { font-style: normal; color: #8d9bb0; }
  .soil u { grid-column: 1 / -1; height: 3px; border-radius: 2px; text-decoration: none;
    background: rgba(255,255,255,.09); }
  .soil u s { display: block; height: 100%; border-radius: 2px; background: #ffcb70; opacity: .55; }
  .art { image-rendering: pixelated; background-repeat: no-repeat; flex: none; }
  .art.runs { animation: run var(--time) steps(var(--steps)) infinite; }
  @keyframes run { from { background-position-x: 0; } to { background-position-x: calc(-1 * var(--w)); } }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: .8em; }
  .facts span { display: flex; flex-direction: column; gap: 1px;
    background: rgba(255,255,255,.04); border-radius: 5px; padding: 6px 8px; }
  .facts i { font-style: normal; color: #8d9bb0; font-size: .82em; }
  .facts b { font-weight: 500; color: #e9eff8; }
  @media (prefers-reduced-motion: reduce) { .art.runs { animation: none; } }
</style>

 * to the better part of a gigabyte, at which point the browser stops decoding
 * and the ground simply goes black - which reads as the map breaking rather
 * than as running out of room. So the ones not looked at recently are let go;
 * they cost a moment to fetch again and nothing at all to keep off the heap.
 */
/*
 * Raised from sixty-four once the levels either side of the one in use
 * started being fetched ahead of time: at sixty-four a zoom in and back out
 * could evict the pictures it was about to want again, and fetch them
 * twice. Ninety-six of them is under a hundred megabytes decoded, which is
 * well short of where the browser gives up.
 */
/*
 * Counts up every time a chunk picture finishes loading. The kept globe is
 * keyed on it, because the first frame of a fresh page is drawn before any
 * ground has arrived - and keeping that one produced a planet of unbroken
 * ocean that never corrected itself.
 */
let arrived = 0;
const KEEP = 96;
const images = new Map();
function chunkImage(z, name) {
  const key = z + '/' + name;
  let img = images.get(key);
  if (img !== undefined) {
    // Move it to the end, so what is in use is never the first to go.
    images.delete(key);
    images.set(key, img);
    return img;
  }
  img = new Image();
  img.decoding = 'async';
  // Something that was not there a moment ago now is, which anything
  // holding a finished picture of the ground needs to know about.
  img.onload = () => { arrived++; };
  img.src = BASE + 'z' + z + '/' + name + '.png';
  images.set(key, img);
  while (images.size > KEEP) {
    // The coarsest level is what a missing chunk falls back on, so it is
    // never the thing that goes; skip past it for the next oldest.
    let oldest = null;
    for (const key of images.keys()) {
      if (key.startsWith(COARSEST + '/')) continue;
      oldest = key; break;
    }
    if (oldest === null) break;
    const gone = images.get(oldest);
    images.delete(oldest);
    if (gone) gone.src = '';
  }
  return img;
}
const haveChunk = new Map();
for (const level of A.levels) haveChunk.set(level.z, new Set(level.chunks));

// The level whose pixels come closest to the screen's.
function levelFor(scale) {
  const wanted = Math.log2(A.px / Math.max(scale, 1e-6));
  return Math.max(0, Math.min(A.levels.length - 1, Math.round(wanted)));
}

/*
 * One level of the ground, as much of it as has arrived.
 *
 * Returns what it managed to draw and what it wanted and did not have, so
 * the caller can decide whether the picture needs propping up underneath.
 */
function drawLevel(z, box, holes) {
  const have = haveChunk.get(z);
  if (!have) return { drawn: 0, missing: 0 };
  const span = A.chunk * (1 << z);
  const near = flatTile(0, 0, box), far = flatTile(box.w, box.h, box);
  // Turned, the corners of the screen reach outside the square it covers.
  const over = turning() ? Math.max(far.x - near.x, far.y - near.y) * 0.5 : 0;
  const c0 = Math.floor((near.x - over) / span), c1 = Math.floor((far.x + over) / span);
  const r0 = Math.floor((near.y - over) / span), r1 = Math.floor((far.y + over) / span);
  const on = span * view.scale;
  let drawn = 0, missing = 0;
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const name = c + '_' + r;
      if (!have.has(name)) continue;
      const img = chunkImage(z, name);
      const at = toScreen(c * span, r * span, box);
      if (!img.complete || !img.naturalWidth) {
        missing++;
        // Where it should have been, for whatever is standing in for it.
        if (holes) holes.push([at.x, at.y, on + 1, on + 1]);
        continue;
      }
      ctx.drawImage(img, at.x, at.y, on + 1, on + 1);
      drawn++;
    }
  }
  return { drawn, missing };
}

/*
 * The ground, and never a hole in it.
 *
 * Changing the zoom changes which level is wanted, and a level that has not
 * been looked at yet is a set of megapixel pictures that have to be fetched
 * and decoded. Drawing only the wanted level meant that for those few
 * hundred milliseconds there was nothing to draw, so the realm went black
 * and came back - which reads as the map breaking rather than as it
 * thinking.
 *
 * So when anything is missing, the coarsest level goes down first. It is
 * four pictures for the whole realm, it is never evicted because it is
 * always in use, and blown up it is soft and too dark in places - but it is
 * the right ground in the right place, and the sharp version lands on top
 * of it a moment later without anything having flickered.
 */
const COARSEST = A.levels.length - 1;

/*
 * Fetch the level we are heading for, not the one we are on.
 *
 * The view eases towards where it was asked to go, so at the moment the
 * wheel turns we already know the zoom it is going to settle at - and
 * therefore which level will be wanted when it gets there. Asking for those
 * pictures now means the fetch and the decode happen during the ease
 * instead of after it, and the soft version underneath is replaced by the
 * sharp one at about the moment the movement stops rather than a beat
 * later.
 *
 * Nothing is drawn here. Asking chunkImage for a picture is what starts it
 * loading; the cache holds it until the frame that wants it arrives.
 */
function warm(z, atX, atY, scale, box) {
  const have = haveChunk.get(z);
  if (!have) return 0;
  const span = A.chunk * (1 << z);
  const half = { x: box.w / 2 / scale, y: box.h / 2 / scale };
  const c0 = Math.floor((atX - half.x) / span), c1 = Math.floor((atX + half.x) / span);
  const r0 = Math.floor((atY - half.y) / span), r1 = Math.floor((atY + half.y) / span);
  let asked = 0;
  for (let r = r0; r <= r1; r++) {
    for (let c = c0; c <= c1; c++) {
      const name = c + '_' + r;
      if (!have.has(name)) continue;
      chunkImage(z, name);
      asked++;
    }
  }
  return asked;
}

/*
 * Where the wheel is taking us, and one step either side of it.
 *
 * The step either side is for the next turn of the wheel: zooming is rarely
 * one notch, and having the neighbour already in hand is the difference
 * between a soft frame and none at all. It only runs while the view is
 * actually moving, so sitting still costs nothing.
 */
function warmAhead(box) {
  const moving = Math.abs(want.scale - view.scale) > view.scale * 0.002
    || Math.abs(want.x - view.x) > 0.5 || Math.abs(want.y - view.y) > 0.5;
  if (!moving) return;
  const going = levelFor(want.scale);
  warm(going, want.x, want.y, want.scale, box);
  if (going > 0) warm(going - 1, want.x, want.y, want.scale * 2, box);
  if (going < COARSEST) warm(going + 1, want.x, want.y, want.scale / 2, box);
}

function drawGround(box) {
  const z = levelFor(view.scale);
  ctx.imageSmoothingEnabled = view.scale < A.px / 2;
  const holes = [];
  const wanted = drawLevel(z, box, holes);
  /*
   * The stand-in goes in the holes, and nowhere else.
   *
   * It used to be laid across the whole view whenever anything anywhere in
   * it was still loading, with the wanted level put back over the top. That
   * is fine where the wanted level has a picture to put back - and open sea
   * is exactly where it has none. A chunk of nothing but water is not in the
   * pyramid at all, so out there the coarsest level was what you were left
   * looking at: soft, and by its own admission too dark in places. Against
   * the sharp chunk next door that is a hard chunk-aligned band of slightly
   * wrong sea, and since panning always has something loading somewhere, it
   * never went away. Three shades of water in one stretch of ocean with two
   * straight vertical joins between them, which is what was reported.
   *
   * Clipped to the missing chunks it does the job it was written for -
   * covering a chunk that is on its way - and leaves everywhere else to the
   * painted ocean, which is one colour and one grain at every zoom. It is
   * also cheaper: the wanted level no longer has to be drawn twice.
   */
  if (holes.length && z !== COARSEST) {
    const smooth = ctx.imageSmoothingEnabled;
    ctx.save();
    ctx.beginPath();
    for (const hole of holes) ctx.rect(hole[0], hole[1], hole[2], hole[3]);
    ctx.clip();
    ctx.imageSmoothingEnabled = true;
    drawLevel(COARSEST, box);
    ctx.restore();
    ctx.imageSmoothingEnabled = smooth;
  }
  return { z, drawn: wanted.drawn };
}

/* ---------------- the mask, read once ---------------- */
let mask = null;
const maskImage = new Image();
maskImage.onload = () => {
  const off = document.createElement('canvas');
  off.width = maskImage.width; off.height = maskImage.height;
  const o = off.getContext('2d', { willReadFrequently: true });
  o.drawImage(maskImage, 0, 0);
  mask = { w: off.width, h: off.height, data: o.getImageData(0, 0, off.width, off.height).data };
  populate();
};
maskImage.src = BASE + 'mask.png';

function atTile(tx, ty) {
  if (!mask) return null;
  if (!Number.isFinite(tx) || !Number.isFinite(ty)) return null;   // off the world
  const x = Math.floor(tx) - B.minX, y = Math.floor(ty) - B.minY;
  if (x < 0 || y < 0 || x >= mask.w || y >= mask.h) return null;
  const at = (y * mask.w + x) * 4;
  const flags = mask.data[at + 1];
  return {
    biome: mask.data[at],
    road: (flags & 1) !== 0,
    walled: (flags & 2) !== 0,             // mountain, deep water: nothing crosses it
    zone: mask.data[at + 2]
  };
}
const zoneOf = (tx, ty) => { const t = atTile(tx, ty); return t ? t.zone : 0; };

/* ---------------- the water that moves ---------------- */
/*
 * A fifth of the realm's floor drifts - open sea rocking, rivers running,
 * lava creeping. It cannot be done in the baked floor, which can only hold
 * one instant, so the tiles that move are listed and drawn here instead, each
 * with its own texture sliding under it.
 *
 * The list holds only water walled in by its own kind. At the water's edge
 * the sand is blended across the tile, and sliding a whole tile over that
 * would cut the shoreline back to a step, so the edge keeps the floor it was
 * baked with.
 */
let wet = null;
const wetArt = new Image();
if (A.water) {
  wetArt.src = BASE + 'water-art.png';
  fetch(BASE + 'water.json').then(r => r.json()).then(index => {
    const img = new Image();
    img.onload = () => {
      const off = document.createElement('canvas');
      off.width = img.width; off.height = img.height;
      const o = off.getContext('2d', { willReadFrequently: true });
      o.drawImage(img, 0, 0);
      const data = o.getImageData(0, 0, img.width, img.height).data;
      // Only the first channel carries anything, so the map is kept as one
      // byte a tile rather than four.
      const at = new Uint8Array(img.width * img.height);
      for (let i = 0, j = 0; j < at.length; i += 4, j++) at[j] = data[i];
      wet = { index: index, at: at };
    };
    img.src = BASE + 'water.png';
  }).catch(() => { wet = null; });
}

function drawWater(box, time) {
  if (!wet || !wetArt.complete || !wetArt.naturalWidth) return 0;
  if (levelFor(view.scale) !== 0) return 0;
  const W = wet.index;
  const flat0 = flatTile(0, 0, box), flat1 = flatTile(box.w, box.h, box);
  const over = turning() ? Math.max(flat1.x - flat0.x, flat1.y - flat0.y) * 0.5 : 0;
  const near = { x: flat0.x - over, y: flat0.y - over };
  const far = { x: flat1.x + over, y: flat1.y + over };
  const x0 = Math.max(W.minX, Math.floor(near.x));
  const x1 = Math.min(W.minX + W.wide - 1, Math.ceil(far.x));
  const y0 = Math.max(W.minY, Math.floor(near.y));
  const y1 = Math.min(W.minY + W.tall - 1, Math.ceil(far.y));
  if (x1 < x0 || y1 < y0) return 0;

  /*
   * How far each kind of drift has slid, worked out once for the frame. Flow
   * runs one way and keeps going; Wave rocks about where it started. Whole
   * pixels either way - the art is pixels, and sliding it by halves turns
   * water into porridge.
   */
  const t = time / 1000;
  const slid = [];
  for (const pic of W.pics) {
    const ox = pic[4] ? Math.sin(t * 1.6) * pic[2] * 8 : t * pic[2] * 8;
    const oy = pic[4] ? Math.cos(t * 1.27) * pic[3] * 8 : t * pic[3] * 8;
    slid.push([((Math.round(ox) % 8) + 8) % 8, ((Math.round(oy) % 8) + 8) % 8]);
  }

  ctx.imageSmoothingEnabled = false;
  const on = view.scale;
  let drawn = 0;
  for (let y = y0; y <= y1; y++) {
    const row = (y - W.minY) * W.wide - W.minX;
    for (let x = x0; x <= x1; x++) {
      const n = wet.at[row + x];
      if (!n) continue;
      const pic = W.pics[n - 1];
      if (!pic) continue;
      const off = slid[n - 1];
      const at = toScreen(x, y, box);
      ctx.drawImage(wetArt, pic[0] + off[0], pic[1] + off[1], 8, 8,
        at.x, at.y, on + 1, on + 1);
      drawn++;
    }
  }
  return drawn;
}


/* ------------------------------------------------------------------ *
 * What is behind the world                                            *
 * ------------------------------------------------------------------ */
/*
 * A planet in a flat black field reads as a diagram of a planet. So there is
 * something behind it: stars, three galaxies, and the occasional thing
 * falling through.
 *
 * It is fixed to the glass and nothing moves it. That is not laziness - it
 * is what distance means. The realm is a couple of thousand tiles across and
 * the nearest star is not, so panning the camera a few hundred tiles cannot
 * shift a star by a pixel, and neither can zooming. What moves is the world
 * in front of it. The only things that do move are the ones that are
 * genuinely close: the meteors.
 *
 * Drawn first of everything, so it is behind the world, behind his head and
 * behind his hands - it is the back of the room, and everything else is in
 * the room.
 *
 * It costs one blit. The stars and the galaxies are painted once into a
 * canvas of their own and kept until the window changes shape; only the few
 * that twinkle and whatever is falling are drawn live.
 */
const STARS = 460;                       // points of light
const STAR_TWINKLE = 54;                 // of them that are drawn live and breathe
const GALAXIES = 3;
const METEORS = 4;                       // slots, each one mostly idle

/*
 * Settled once from a fixed roll, so it is the same sky every time the page
 * is opened rather than a new one every visit. Positions are shares of the
 * window rather than pixels, so a resize moves nothing about relative to
 * anything else - it only redraws it larger.
 */
const space = (() => {
  let seed = 987654321;
  const roll = () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const stars = [];
  for (let i = 0; i < STARS; i++) {
    /*
     * Mostly faint, a few bright. A flat spread of brightness gives a field
     * of identical dots, which is what a starfield never looks like; the
     * fourth power puts nearly all of them at the threshold of visible and
     * leaves a handful to carry the picture.
     */
    const lit = Math.pow(roll(), 4);
    stars.push({
      x: roll(), y: roll(),
      lit: 0.16 + lit * 0.84,
      size: 0.5 + lit * 1.5,
      // Faintly coloured, the way stars are: cold blue-white through to a
      // dull orange, and never saturated enough to read as a pixel fault.
      warm: roll(),
      breathAt: roll() * Math.PI * 2,
      breathRate: 0.35 + roll() * 1.1
    });
  }
  const galaxies = [];
  for (let i = 0; i < GALAXIES; i++) {
    galaxies.push({
      x: 0.1 + roll() * 0.8, y: 0.1 + roll() * 0.8,
      wide: 0.09 + roll() * 0.13,        // of the shorter side
      thin: 0.22 + roll() * 0.4,         // how flat on, edge to face
      turn: roll() * Math.PI,
      lit: 0.05 + roll() * 0.05,
      warm: roll()
    });
  }
  /*
   * The meteors are scheduled rather than remembered: each slot has a period
   * and a phase, so whether one is falling at any moment is a sum rather than
   * a state, and there is nothing to keep in step or to reset.
   */
  const meteors = [];
  for (let i = 0; i < METEORS; i++) {
    const heading = (roll() - 0.5) * 1.1 + (roll() < 0.5 ? 2.55 : 0.6);
    meteors.push({
      from: { x: roll(), y: roll() * 0.55 },
      dx: Math.cos(heading), dy: Math.sin(heading),
      reach: 0.1 + roll() * 0.16,        // of the shorter side, end to end
      life: 0.55 + roll() * 0.7,         // seconds it takes to cross
      every: 11 + roll() * 26,           // and how long between goes
      at: roll() * 30
    });
  }
  return { stars, galaxies, meteors };
})();

/* A star's colour, from cold to warm. */
const starInk = warm => warm < 0.62
  ? '198, 214, 255'
  : (warm < 0.86 ? '255, 248, 232' : '255, 214, 178');

const starField = document.createElement('canvas');
const starCtx = starField.getContext('2d');
let starKey = null;

function paintSpace(box, grain) {
  const key = Math.round(box.w) + 'x' + Math.round(box.h) + '@' + grain;
  if (key === starKey) return;
  starField.width = Math.max(1, Math.round(box.w * grain));
  starField.height = Math.max(1, Math.round(box.h * grain));
  starCtx.setTransform(grain, 0, 0, grain, 0, 0);
  starCtx.clearRect(0, 0, box.w, box.h);
  const short = Math.min(box.w, box.h);

  /*
   * The galaxies first, under everything. A round gradient squashed and
   * turned, which is a galaxy seen from an angle - and at five per cent of
   * white it is a smudge you notice rather than a shape you look at.
   */
  for (const one of space.galaxies) {
    const r = one.wide * short;
    starCtx.save();
    starCtx.translate(one.x * box.w, one.y * box.h);
    starCtx.rotate(one.turn);
    starCtx.scale(1, one.thin);
    const glow = starCtx.createRadialGradient(0, 0, 0, 0, 0, r);
    glow.addColorStop(0, 'rgba(' + starInk(one.warm) + ',' + one.lit.toFixed(3) + ')');
    glow.addColorStop(0.45, 'rgba(' + starInk(one.warm) + ',' + (one.lit * 0.4).toFixed(3) + ')');
    glow.addColorStop(1, 'rgba(' + starInk(one.warm) + ',0)');
    starCtx.fillStyle = glow;
    starCtx.beginPath();
    starCtx.arc(0, 0, r, 0, Math.PI * 2);
    starCtx.fill();
    starCtx.restore();
  }

  // Then the stars that hold still, which is most of them.
  for (let i = STAR_TWINKLE; i < space.stars.length; i++) {
    const one = space.stars[i];
    starCtx.fillStyle = 'rgba(' + starInk(one.warm) + ',' + one.lit.toFixed(3) + ')';
    starCtx.beginPath();
    starCtx.arc(one.x * box.w, one.y * box.h, one.size, 0, Math.PI * 2);
    starCtx.fill();
  }
  starKey = key;
}

/*
 * How much of space there is to see, which is how little of the window the
 * world takes up. Once the planet overflows the frame there is no sky behind
 * it and the whole layer is skipped.
 */
const spaceLeft = box => {
  const reach = Math.hypot(box.w, box.h) / 2;
  const t = 1 - globe() / reach;
  return Math.max(0, Math.min(1, t * 1.4));
};

function drawSpace(box, now) {
  const showing = spaceLeft(box);
  if (showing <= 0.01) return 0;
  const grain = Math.min(2, window.devicePixelRatio || 1);
  paintSpace(box, grain);
  const t = now / 1000;
  const short = Math.min(box.w, box.h);

  ctx.save();
  ctx.globalAlpha = showing;
  ctx.drawImage(starField, 0, 0, box.w, box.h);

  /*
   * The few that breathe. Air is what makes a star twinkle and there is no
   * air out here, so this is a liberty - but a field in which absolutely
   * nothing changes reads as a printed backdrop, and fifty of them moving
   * slowly is enough to stop that without anyone catching one at it.
   */
  for (let i = 0; i < STAR_TWINKLE && i < space.stars.length; i++) {
    const one = space.stars[i];
    const breath = 0.72 + 0.28 * Math.sin(t * one.breathRate + one.breathAt);
    ctx.fillStyle = 'rgba(' + starInk(one.warm) + ',' + (one.lit * breath).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(one.x * box.w, one.y * box.h, one.size * breath, 0, Math.PI * 2);
    ctx.fill();
  }

  /*
   * And whatever is falling. A slot is idle almost all of the time; when it
   * is not, the streak is a line from where the head has got to back to where
   * it came from, fading along its length and fading again at both ends of
   * its run so it neither appears nor vanishes at full brightness.
   */
  for (const one of space.meteors) {
    const cycle = (t + one.at) % one.every;
    if (cycle > one.life) continue;
    const k = cycle / one.life;
    const reach = one.reach * short;
    const x0 = one.from.x * box.w, y0 = one.from.y * box.h;
    const headX = x0 + one.dx * reach * k, headY = y0 + one.dy * reach * k;
    const tailBy = Math.min(k, 0.38);
    const tailX = headX - one.dx * reach * tailBy, tailY = headY - one.dy * reach * tailBy;
    // Brightest in the middle of the run, gone at both ends of it.
    const bright = Math.sin(Math.PI * k) * showing;
    if (bright <= 0.01) continue;
    const trail = ctx.createLinearGradient(tailX, tailY, headX, headY);
    trail.addColorStop(0, 'rgba(190, 210, 255, 0)');
    trail.addColorStop(1, 'rgba(236, 244, 255,' + bright.toFixed(3) + ')');
    ctx.strokeStyle = trail;
    ctx.lineWidth = 1.35;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(headX, headY);
    ctx.stroke();
  }
  ctx.restore();
  return 1;
}

/* ------------------------------------------------------------------ *
 * Weather, and things with wings                                      *
 * ------------------------------------------------------------------ */
/*
 * A world with nothing moving over it reads as a diagram of a world. So there
 * is weather on it: cloud drifting westward over the ocean, a shimmer where
 * the light catches the water, and birds once you are near enough for a bird
 * to make sense.
 *
 * The weather is in front of the camera, not on the map.
 *
 * It used to be laid out in tiles and put through the same projection as the
 * ground, which is defensible - weather is somewhere - and wrong to look at:
 * drag the realm and the sky came with it, as though the whole sky were
 * painted on the glass of the map rather than hanging in front of it. Nothing
 * about a cloud says which tile it is over. So a bank now has a place on the
 * glass instead, on a disc of its own, and the realm slides about underneath
 * it while the cloud keeps drifting west at its own pace.
 *
 * Coming down through it is the whole of the effect. Each bank is shoved out
 * from the middle of the view as the zoom rises, and further the nearer it is
 * - so they part and stream past the edges of the window rather than dissolve
 * where they stand, and the ground opens up through the gap between them.
 * They keep most of their weight while that happens and only give it up at
 * the end, because a cloud that fades while it moves reads as a cloud that
 * was never there. The birds arrive as the last of it leaves.
 *
 * It costs twenty pictures on one sheet, blitted about a hundred times.
 */
/*
 * The sky is done with by the time one zone fills the window.
 *
 * This has come down twice and for the same reason each time. At seven the
 * weather was still thinning at three tiles to the pixel; at three and a
 * half there was still cloud over a zone you had gone in to read, which is
 * the one thing the sky must never be doing. The map is read from about
 * one and a half tiles to the pixel upwards, so the weather is finished
 * before that and the last of it goes while you are still looking at the
 * whole realm rather than at a part of it.
 *
 * That leaves about a dozen turns of the wheel between the thickest
 * weather and none, which is plenty to come down through - the range only
 * looks short written as two numbers because every turn multiplies.
 */
const CLOUD_GONE = 1.9;                  // zoom by which the sky has cleared
const CLOUD_FULL = 0.5;                  // and below which it is at its thickest
/*
 * How large the sky is, and what the approach does to it.
 *
 * The sky is the smaller of the world and the window. Stood right back the
 * planet is a disc in the middle of a black field and weather belongs on the
 * disc, so the sky is the disc; come close enough that the world overflows
 * the window and there is no disc to speak of, so the sky is the window. The
 * two are the same size at the moment they change over, which is why nothing
 * jumps: the disc reaches this share of the screen just as the weather starts
 * to lift, so the handover happens under a sky that is still whole.
 */
const SKY_SPAN = 0.55;                   // of the screen diagonal, the sky's radius
const SKY_PUSH = 5.5;                    // how far out the approach shoves a bank
const SKY_INK = 0.9;                     // how solid the thickest weather is
/*
 * How far a front travels before it comes round again.
 *
 * Wide enough that a whole system is well clear of the window before it
 * wraps, which is what lets the wrap happen with nothing to hide it. The
 * banks used to thin away and return one at a time over the last of their
 * own run - fine when each drifted alone, and no use at all now that they
 * travel together, because a group fading through its own tail tears in half
 * in plain sight. Nothing fades at the edges any more; a front simply leaves
 * on one side and arrives on the other, off camera.
 */
const SKY_WRAP = 3.6;                    // sky radii a front drifts before it returns
/*
 * How the sky answers the world being turned under it.
 *
 * Weather sits on a world, and a world that turns takes its air with it -
 * not at once, and not all of it, because air slips. Shove the realm and
 * the cloud is pulled after it, late, and it keeps most of the ground it
 * was given rather than sliding back.
 *
 * The first attempt at this hung the sky off a lagging copy of the camera
 * and it was wrong in a way worth writing down, because it looks almost
 * right. A copy that eases towards the camera converges on it, so the
 * offset it produces always decays to nothing: the cloud jumps with the map
 * and then slides back against it. The visible motion is therefore in the
 * wrong direction - not while you drag, but for the second afterwards, when
 * the whole sky is drifting the other way. Lag is not a decaying offset. It
 * is arriving late somewhere and staying there.
 *
 * So what is kept is how far the air has been dragged, in tiles, added to
 * frame by frame as a share of wherever the camera went and eased towards
 * rather than jumped to. Pan and come back and it nets out; pan one way for
 * a long time and it stops at the slip below, because a planet cannot drag
 * its atmosphere off itself.
 */
const SKY_DRAG = 0.55;                   // the share of the movement it takes
const SKY_CATCH = 2.6;                   // and how quickly it gets there
const SKY_SLIP = 0.5;                    // sky radii it may ever be dragged

const skyPull = { x: 0, y: 0, toX: 0, toY: 0, wasX: 0, wasY: 0, set: false };
function stepSky(delta, box) {
  if (!skyPull.set) {
    skyPull.wasX = view.x; skyPull.wasY = view.y; skyPull.set = true;
    return;
  }
  // Where the camera went since the last frame, and the air taking its share.
  skyPull.toX += (view.x - skyPull.wasX) * SKY_DRAG;
  skyPull.toY += (view.y - skyPull.wasY) * SKY_DRAG;
  skyPull.wasX = view.x; skyPull.wasY = view.y;
  /*
   * Held to a share of the sky rather than a number of tiles, since a tile
   * is a different distance at every zoom - and held on the target rather
   * than on the drawing, so that panning back out of the limit answers at
   * once instead of crossing a dead zone first.
   */
  const room = Math.min(globe(), Math.hypot(box.w, box.h) * SKY_SPAN) * SKY_SLIP;
  const most = room / Math.max(1e-6, view.scale);
  skyPull.toX = Math.max(-most, Math.min(most, skyPull.toX));
  skyPull.toY = Math.max(-most, Math.min(most, skyPull.toY));
  const catchUp = Math.min(1, delta * SKY_CATCH);
  skyPull.x += (skyPull.toX - skyPull.x) * catchUp;
  skyPull.y += (skyPull.toY - skyPull.y) * catchUp;
}
/*
 * How many banks there are, and how many weather systems they make up.
 *
 * A cloud does not wander the sky on its own. Given a drift each, they
 * spread evenly across the glass within a minute or two and what was left
 * looked less like weather than like a screensaver - and the drifts
 * themselves were four times too quick, crossing the window in half a minute
 * when weather takes a few. So the banks belong to fronts: a front has one
 * drift and every bank in it keeps its place in the group, so they arrive
 * together, cross together and leave together.
 *
 * There are more banks than there used to be because most of them are off
 * camera at any moment - the wrap is three and a half skies wide and the
 * window is about one. They cost a rejected bounds test each.
 */
const BANKS = 96;
const FRONTS = 9;
const BIRDS_FROM = 2.4, BIRDS_TO = 26;   // the zooms a bird makes sense at

/*
 * The cloud is the client's own, stamped into shapes when the map was built.
 * It is drawn as pixels and nothing else: no blur, no gradient, no smoothing
 * - the same grain as the ground under it.
 */
let skyArt = null;
const skySheet = new Image();
const oryxSheet = new Image();
if (A.sky) {
  skySheet.src = BASE + 'sky.png';
  fetch(BASE + 'sky.json').then(r => r.json())
    .then(one => { skyArt = one; }).catch(() => { skyArt = null; });
}

/*
 * He is not fetched until he is wanted.
 *
 * His picture is the largest single thing the map carries and it is seen at
 * one distance only - the furthest one, which most people opening the atlas
 * will never go to. Asking for it on the way in would put a megabyte and more
 * in front of the ground, which is the thing they did come for.
 */
let sentFor = false;
function callForOryx() {
  if (sentFor || !A.sky) return;
  sentFor = true;
  oryxSheet.src = BASE + 'oryx.png';
}

/*
 * Out of the blue, and into the dark.
 *
 * The picture arrives lit for space - dimmed and tinted by how far each
 * part of him lies from the two things that throw any light, the face of the
 * world below and the lamps in his helm. The idea is right and the amount
 * was wrong in both directions. The world is a blue planet, so the light it
 * throws is blue, and a gauntlet holding a blue planet came back the colour
 * of cold steel: nearly half the pixels of a hand are bluer than they are
 * red, and the rims of the claws peak at 179,227,253, which is not armour
 * but chrome. And the head, lit from the front by its own fire, ended with a
 * bright crimson silhouette cut cleanly out of the night - a sticker of a
 * head rather than a head with a night behind it.
 *
 * So the sheet is re-lit once, when it arrives, into a canvas of its own.
 * Both hands are pulled towards neutral and taken down, hardest where they
 * were brightest, so what was chrome is dark iron. The head keeps its fire
 * and loses its outline: everything within a rim of the silhouette is dimmed
 * towards nothing, so the horns come out of the dark instead of being drawn
 * on top of it.
 *
 * Done here rather than in the picture because the picture is baked on the
 * machine that has the client, and the amount of it is a thing to be looked
 * at and changed. It costs one pass over a megapixel and a bit, once.
 */
const HAND_CAST = 0.3;                   // how much of the cold cast is kept
const HAND_LIGHT = 0.72;                 // and how much of the light
const HAND_SHEEN = 0.42;                 // extra taken off where it was brightest
const HEAD_RIM = 0.14;                   // what is left of him at the silhouette
const HEAD_DEEP = 55;                    // pixels of the picture the rim reaches in

/*
 * A hand, pulled to neutral and dimmed.
 *
 * Neutral means towards the darkest of its own three channels rather than
 * towards its red: half of these pixels are warmer than they are cold, and
 * pulling those towards red would have brightened them. Towards the least
 * channel always darkens, and it takes any cast out whichever way it leans.
 */
function ironOut(px, wide, cut) {
  for (let y = cut[1]; y < cut[1] + cut[3]; y++) {
    for (let x = cut[0]; x < cut[0] + cut[2]; x++) {
      const at = (y * wide + x) * 4;
      if (!px[at + 3]) continue;
      const r = px[at], g = px[at + 1], b = px[at + 2];
      const lo = Math.min(r, g, b);
      const nr = lo + (r - lo) * HAND_CAST;
      const ng = lo + (g - lo) * HAND_CAST;
      const nb = lo + (b - lo) * HAND_CAST;
      const down = HAND_LIGHT * (1 - (Math.max(nr, ng, nb) / 255) * HAND_SHEEN);
      px[at] = nr * down;
      px[at + 1] = ng * down;
      px[at + 2] = nb * down;
    }
  }
}

/*
 * And the head, given a night to come out of.
 *
 * How far in from the silhouette each pixel lies, by the usual two passes -
 * out from the clear edge and back again - and then dimmed by that. The fire
 * is spared: a pixel that is much redder than it is anything else is one of
 * the seams or one of the eyes, and those are the light in the picture rather
 * than the thing being lit.
 */
function intoTheDark(px, wide, cut) {
  const x0 = cut[0], y0 = cut[1], w = cut[2], h = cut[3];
  const far = new Float32Array(w * h);
  const FAR = 1e6;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      far[y * w + x] = px[((y0 + y) * wide + x0 + x) * 4 + 3] < 24 ? 0 : FAR;
    }
  }
  const D = 1, DD = 1.4142;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (!far[i]) continue;
      let d = far[i];
      if (x > 0) d = Math.min(d, far[i - 1] + D);
      if (y > 0) d = Math.min(d, far[i - w] + D);
      if (x > 0 && y > 0) d = Math.min(d, far[i - w - 1] + DD);
      if (x < w - 1 && y > 0) d = Math.min(d, far[i - w + 1] + DD);
      far[i] = d;
    }
  }
  for (let y = h - 1; y >= 0; y--) {
    for (let x = w - 1; x >= 0; x--) {
      const i = y * w + x;
      if (!far[i]) continue;
      let d = far[i];
      if (x < w - 1) d = Math.min(d, far[i + 1] + D);
      if (y < h - 1) d = Math.min(d, far[i + w] + D);
      if (x < w - 1 && y < h - 1) d = Math.min(d, far[i + w + 1] + DD);
      if (x > 0 && y < h - 1) d = Math.min(d, far[i + w - 1] + DD);
      far[i] = d;
    }
  }
  // The edge of the picture is not the edge of him, so it does not count.
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const at = ((y0 + y) * wide + x0 + x) * 4;
      if (!px[at + 3]) continue;
      const r = px[at], g = px[at + 1], b = px[at + 2];
      const t = Math.min(1, far[y * w + x] / HEAD_DEEP);
      let keep = HEAD_RIM + (1 - HEAD_RIM) * (t * t * (3 - 2 * t));
      const fire = Math.max(0, (r - Math.max(g, b)) / 255);
      keep += (1 - keep) * Math.min(1, fire * 2.6);
      px[at] = r * keep;
      px[at + 1] = g * keep;
      px[at + 2] = b * keep;
    }
  }
}

/*
 * The sheet as it is actually drawn, re-lit on first use.
 *
 * On first use rather than on load, because it wants both the picture and
 * the table of rectangles within it, and those arrive down two different
 * wires in whichever order the network feels like. Null until both are here,
 * which is the same answer the callers already handle.
 */
let oryxArt = null, oryxLit = false;
function oryxPaint() {
  if (oryxLit) return oryxArt;
  if (!skyArt || !skyArt.oryx) return null;
  if (!oryxSheet.complete || !oryxSheet.naturalWidth) return null;
  oryxLit = true;
  oryxArt = oryxSheet;
  try {
    const wide = oryxSheet.naturalWidth, tall = oryxSheet.naturalHeight;
    const pad = document.createElement('canvas');
    pad.width = wide; pad.height = tall;
    const pen = pad.getContext('2d', { willReadFrequently: true });
    pen.drawImage(oryxSheet, 0, 0);
    const sheet = pen.getImageData(0, 0, wide, tall);
    const O = skyArt.oryx;
    for (const cut of [O.handL, O.handR]) if (cut) ironOut(sheet.data, wide, cut);
    if (O.head) intoTheDark(sheet.data, wide, O.head);
    pen.putImageData(sheet, 0, 0);
    oryxArt = pad;
  } catch (e) {
    // A sheet that cannot be read is drawn as it came.
  }
  return oryxArt;
}

/*
 * Oryx, closing on the world.
 *
 * Only when you have drawn right back, and more of him the further back you
 * go: the head rises from behind the planet and the hands come in from either
 * side, both of them breathing a little so they are held rather than pasted.
 * Come down towards the ground and he lets go.
 */
/*
 * He begins at the very end of the wheel.
 *
 * Reckoned as a multiple of the furthest you may stand rather than as a zoom
 * of its own, because both the floor and the view the map opens at are set
 * from the size of the window: written as a plain number he would be half
 * out already on a tall screen and nowhere to be seen on a short one.
 *
 * At one and three quarter floors he was a step back from the opening view,
 * which is another way of saying he was on screen most of the time anyone
 * opened the map. He is supposed to be something you find. So he is inside
 * the last tenth of the range now: you have to pull back until the wheel
 * stops, which is seven or eight notches past where the realm fits the
 * window, and there he is.
 */
/*
 * How far out he begins, counted in floors rather than in zooms because both
 * the floor and the view the map opens at are set from the size of the
 * window: written as a plain number he would be half out already on a tall
 * screen and nowhere to be seen on a short one.
 *
 * It used to be 1.12, which put the whole of him inside the last twelfth of
 * the wheel - a single notch from nothing to all of him, which is not an
 * arrival, it is a jump scare. The map opens at about twice the floor, so
 * there is room for the best part of an octave between the two, and he now
 * has it.
 */
const ORYX_FROM = 1.85;                  // in floors, the distance he starts at

function oryxShows(box) {
  if (!A.sky || !skyArt || !skyArt.oryx) return 0;
  if (!roundWorld(box)) return 0;
  const least = floorZoom(box), from = least * ORYX_FROM;
  if (view.scale >= from) return 0;
  // Sent for a little before he is due, so he has arrived by the time he is.
  if (view.scale < from * 1.08) callForOryx();
  if (!oryxSheet.complete || !oryxSheet.naturalWidth) return 0;
  /*
   * Measured by ratio and eased at both ends.
   *
   * Straight subtraction spends most of its range on the last notch or two,
   * because every notch of a wheel multiplies rather than adds - so he
   * appeared all at once however wide the span was made. Read as a ratio, the
   * same span is spread evenly over every notch of the way out; smoothed, he
   * neither starts nor finishes abruptly, but swims up out of the dark.
   */
  const t = Math.max(0, Math.min(1,
    Math.log(from / view.scale) / Math.log(from / least)));
  return t * t * (3 - 2 * t);
}

// The head, behind the world - so it is drawn before the world is.
function drawOryxBehind(box, now) {
  const showing = oryxShows(box);
  if (showing <= 0.01) return;
  const cut = skyArt.oryx.head;
  const R = globe();
  /*
   * Sized to the room there is for him rather than to the world.
   *
   * All of him that can ever be seen is the part standing above the world:
   * horns, brow, eyes, and the top of the cheeks - about the upper three
   * fifths of the picture. So it is that fraction which is fitted into the
   * gap between the top of the window and the top of the world, and he never
   * has his horns cut off by the edge of the glass however the window is
   * shaped.
   */
  const SHOWN = 0.62;
  const room = Math.max(40, box.h / 2 - R - 8);
  const wide = Math.min(R * 2 * 1.7, (room / SHOWN) * cut[2] / cut[3]);
  const tall = wide * cut[3] / cut[2];
  const breathe = Math.sin(now / 1700) * R * 0.012;
  /*
   * Risen until his eyes are clear of the horizon and the rest of him is
   * behind the world; sunk away again as you come down towards the ground.
   */
  const risen = box.h / 2 - R - tall * (SHOWN - 0.5);
  const sunk = box.h / 2 - R * 0.3;
  const y = sunk + (risen - sunk) * showing + breathe;
  ctx.save();
  ctx.globalAlpha = showing;
  ctx.drawImage(oryxPaint() || oryxSheet, cut[0], cut[1], cut[2], cut[3],
    box.w / 2 - wide / 2, y - tall / 2, wide, tall);
  ctx.restore();
}

// And the hands, in front of it.
function drawOryxHands(box, now) {
  const showing = oryxShows(box);
  if (showing <= 0.01) return;
  const R = globe();
  const cy = box.h / 2 + R * 0.14;
  // Closing on it as you draw back, and never quite still.
  const reach = R * (1.34 - 0.22 * showing);
  ctx.save();
  ctx.globalAlpha = showing;
  for (const side of [-1, 1]) {
    /*
     * Each hand is its own picture, drawn the way round it was drawn. They
     * were one picture of a pair facing each other and they are not quite
     * mirror images, so turning one of them over to serve as the other put a
     * left hand on the right of the world.
     */
    const cut = side < 0 ? skyArt.oryx.handL : skyArt.oryx.handR;
    if (!cut) continue;
    const tall = R * 2 * 1.02, wide = tall * cut[2] / cut[3];
    const bob = Math.sin(now / 1300 + (side > 0 ? 1.7 : 0)) * R * 0.022;
    // Anchored by the edge that reaches, which is the one facing the world.
    const edge = box.w / 2 + side * reach;
    ctx.drawImage(oryxPaint() || oryxSheet, cut[0], cut[1], cut[2], cut[3],
      side < 0 ? edge - wide : edge, cy + bob - tall / 2, wide, tall);
  }
  ctx.restore();
}

/*
 * Where the weather sits, settled once from a fixed roll so it is the same
 * world every time it is opened rather than a new one every frame.
 */
const weather = (() => {
  let seed = 20260902;
  const roll = () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const midX = (B.minX + B.maxX) / 2, midY = (B.minY + B.maxY) / 2;
  const banks = [];
  /*
   * Which picture each bank wears, dealt rather than rolled.
   *
   * Rolled independently, twenty shapes over ninety-six banks left some of
   * them used far more than others and one or two not at all - and the ones
   * that go missing are missing for good, since the roll is fixed. Dealt
   * round and then shuffled, every drawing is on the world about five times
   * and the sky is as varied as the folder it came from.
   */
  const shapes = [];
  for (let i = 0; i < BANKS; i++) shapes.push(i);
  for (let i = shapes.length - 1; i > 0; i--) {
    const j = Math.floor(roll() * (i + 1));
    const swap = shapes[i]; shapes[i] = shapes[j]; shapes[j] = swap;
  }
  /*
   * The fronts, laid out along the run and down the sky rather than dropped
   * anywhere on either.
   *
   * One to each ninth of the wrap and jittered within it, so the sky is
   * never empty and never all arrives at once - rolled freely they clumped,
   * two systems overlapping and then four skies of nothing.
   *
   * Latitude needed the same treatment and did not have it: nine free rolls
   * put six of the nine in the top half, which is exactly what it looked
   * like. Bands again, and shuffled independently of the along-the-run
   * order - taking them in the same order would lay every front on one
   * diagonal, which is tidier than clumping and just as wrong.
   */
  const bands = [];
  for (let i = 0; i < FRONTS; i++) bands.push(i);
  for (let i = bands.length - 1; i > 0; i--) {
    const j = Math.floor(roll() * (i + 1));
    const swap = bands[i]; bands[i] = bands[j]; bands[j] = swap;
  }
  const fronts = [];
  for (let i = 0; i < FRONTS; i++) {
    fronts.push({
      x: ((i + 0.15 + roll() * 0.7) / FRONTS) * SKY_WRAP - SKY_WRAP / 2,
      y: ((bands[i] + 0.15 + roll() * 0.7) / FRONTS - 0.5) * 1.55,
      /*
       * Sky radii a second, westward - so the pace is the same fraction of
       * what you can see at every zoom, which is the only reading that makes
       * sense when the sky is the planet at one end of the range and the
       * window at the other. A front crosses the whole sky in a minute or
       * two: gentle, and still plainly moving. Real weather from orbit is
       * slower than this and looks like a photograph.
       */
      drift: 0.020 + roll() * 0.018,
      spread: 0.45 + roll() * 0.6
    });
  }
  for (let i = 0; i < BANKS; i++) {
    const front = fronts[i % FRONTS];
    // Its place in the group, kept for good: the group is rigid, and what
    // stops it looking pasted together is the sway below rather than a drift
    // of its own, which would pull the group apart over a few crossings.
    const a = roll() * Math.PI * 2, r = Math.sqrt(roll());
    banks.push({
      front,
      ox: Math.cos(a) * r * front.spread,
      oy: Math.sin(a) * r * front.spread * 0.62,
      wide: 0.10 + roll() * 0.22,       // of the sky's radius, across
      shape: shapes[i],
      // A slow breath, so a bank is not welded to its neighbours. Small
      // enough and long enough that you never catch it going round.
      swayAmp: 0.005 + roll() * 0.012,
      swayRate: 0.057 + roll() * 0.1,
      swayAt: roll() * Math.PI * 2,
      // How much the approach moves it, which is how near it is. The far
      // ones hold the middle of the view while the near ones stream past.
      depth: 0.45 + roll() * 1.05,
      dim: 0.62 + roll() * 0.38
    });
  }
  const birds = [];
  for (let i = 0; i < 7; i++) {
    const fx = midX + (roll() - 0.5) * (B.maxX - B.minX) * 0.8;
    const fy = midY + (roll() - 0.5) * (B.maxY - B.minY) * 0.8;
    const heading = roll() * Math.PI * 2;
    for (let k = 0; k < 3 + Math.floor(roll() * 3); k++) {
      birds.push({
        x: fx + (roll() - 0.5) * 26, y: fy + (roll() - 0.5) * 20,
        vx: Math.cos(heading) * (2.2 + roll()), vy: Math.sin(heading) * (2.2 + roll()),
        beat: roll() * 6, span: 0.55 + roll() * 0.45
      });
    }
  }
  return { banks, birds, midX, midY };
})();

/*
 * How far down the approach we are: nought where the weather is thickest,
 * one where it has gone.
 *
 * Measured across the zoom the way the zoom is actually worked - by ratio,
 * not by difference. Every notch of the wheel multiplies, so a straight
 * reading spends nearly all of its range on the last two notches and clears
 * the whole sky in a moment; read as a ratio the same clearing is spread
 * evenly over every notch of the approach, which is a dozen of them rather
 * than three.
 */
const skyGone = () => Math.max(0, Math.min(1, 1 -
  Math.log(CLOUD_GONE / Math.max(CLOUD_FULL, view.scale))
  / Math.log(CLOUD_GONE / CLOUD_FULL)));

/*
 * And how much of it is left to see, which is not the same shape.
 *
 * The moving and the fading are deliberately out of step. If a bank thins
 * at the rate it travels then by the time it has gone anywhere it is already
 * half transparent, and coming down reads as the weather evaporating in
 * place. Held at nearly full weight for the first half of the approach and
 * given up over the second, the same movement reads as the camera pushing
 * the cloud aside - the bank stays a cloud right up to the point where it
 * leaves the frame.
 */
const skyLeft = () => 1 - Math.pow(skyGone(), 2.2);


/*
 * Each cloud, cut off the sheet and kept at four sizes.
 *
 * A bank is drawn anywhere from thirty pixels across at the far view to five
 * hundred coming down through it, off art that is a hundred and twenty-eight
 * wide - so at the far end the browser was throwing away three pixels in
 * four in a single step. One step of bilinear does that badly: it samples
 * rather than averages, so half the detail of the drawing turns into a fine
 * crawling sparkle instead of into a smooth small cloud, and the sparkle is
 * worst exactly where the cloud is smallest and there is most sky full of
 * them. Standing back should give a simpler cloud, not a noisier one.
 *
 * So each is halved and halved again with the good filter, once, at load;
 * drawing picks the smallest copy still larger than the size it wants, and
 * never has to shrink by more than half. Coming down the range it walks back
 * up the copies and the detail returns with the size.
 *
 * Cutting them out separately also ends any argument about the single pixel
 * between neighbours on the sheet: halved twice that gap is a quarter of a
 * pixel, and the cloud next door starts bleeding into the edge of this one.
 */
let skyMips = null;
function cloudArt() {
  if (skyMips) return skyMips;
  if (!skyArt || !skyArt.clouds) return null;
  if (!skySheet.complete || !skySheet.naturalWidth) return null;
  skyMips = skyArt.clouds.map(cut => {
    const steps = [];
    let wide = cut[2], tall = cut[3], from = null;

   * the world only while the world is the smaller of the two - stood right

   * whereas close in the ground fills the window and a bank being shoved out

   * measured by ratio, the first few notches of the wheel are already a fifth
   * of the way down it. So the sky was parting before there was any sense of
   * coming down through it, and by the time the ground was worth reading only
   * a handful of banks were still in frame. Squared, the first half of the
   * approach barely moves them and the second half throws them past the edges
   * of the window: you come down into a full sky and it opens up in front of
   * you, which is the thing being drawn.
   */

   * How far the air has been dragged, on the glass. Negative of the pull,
   * because the pull is measured in the world and the world moves the other
   * way from the camera that is looking at it.
   */

  const lagY = -skyPull.y * view.scale;

   * And coming at you as they part, which is the other half of coming down
   * through them.
   *
   * A bank is drawn at a share of the sky, and the sky stops growing once
   * it is the window rather than the planet - so from about two thirds of a
   * tile to the pixel upwards the clouds held one size in pixels however
   * far you came in, which reads as flying towards a painted backdrop. They
   * swell with the approach now, by rather more than half of what it shoves
   * them: they grow, they part, and between the two they are out of the
   * frame well before the last of their weight goes. That is what makes it
   * the camera pushing them aside rather than the weather thinning out.
   */
  const grow = 1 + (push - 1) * 0.6;

     * wrapping on its own - which would take a group apart at the seam, one
     * cloud at a time, in the middle of the sky.
     */
    const front = one.front;

    const sway = Math.sin(t * one.swayRate + one.swayAt) * one.swayAmp;
    const sx = fx + one.ox + sway;

    if (onDisc) {

/*
 * Birds, once the cloud is thin enough to see past. They wander rather than
 * fly anywhere, turn slowly, and are kept over the realm so they are not
 * found flapping across open ocean.

function stepBirds(delta) {
  if (view.scale < BIRDS_FROM || view.scale > BIRDS_TO) return;
  for (const one of weather.birds) {
    one.beat += delta * 7;
    const turn = (Math.random() - 0.5) * 0.9 * delta;
    const cos = Math.cos(turn), sin = Math.sin(turn);
    const vx = one.vx * cos - one.vy * sin, vy = one.vx * sin + one.vy * cos;
    one.vx = vx; one.vy = vy;

    if (one.x < B.minX) { one.x = B.minX; one.vx = Math.abs(one.vx); }
    if (one.x > B.maxX) { one.x = B.maxX; one.vx = -Math.abs(one.vx); }
    if (one.y < B.minY) { one.y = B.minY; one.vy = Math.abs(one.vy); }
    if (one.y > B.maxY) { one.y = B.maxY; one.vy = -Math.abs(one.vy); }

function drawBirds(box) {
  if (view.scale < BIRDS_FROM || view.scale > BIRDS_TO) return 0;
  const fade = Math.min(1, (view.scale - BIRDS_FROM) / 2)
    * Math.min(1, (BIRDS_TO - view.scale) / 6);
  if (fade <= 0.02) return 0;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  let drawn = 0;
  for (const one of weather.birds) {
    const at = place(one.x, one.y, box);
    if (!at) continue;
    if (at.x < -20 || at.y < -20 || at.x > box.w + 20 || at.y > box.h + 20) continue;
    /*
     * A pair of strokes that open and close, which is all a bird is from up
     * here - drawn twice, a pale one under a dark one, so it reads over a
     * dark forest as well as over sand.
     */
    const arm = Math.max(5, Math.min(26, view.scale * 1.5)) * one.span * at.k;
    const lift = Math.sin(one.beat) * arm * 0.5;
    const wing = () => {
      ctx.beginPath();
      ctx.moveTo(at.x - arm, at.y - lift);
      ctx.quadraticCurveTo(at.x - arm * 0.45, at.y - lift * 0.15, at.x, at.y);
      ctx.quadraticCurveTo(at.x + arm * 0.45, at.y - lift * 0.15, at.x + arm, at.y - lift);
      ctx.stroke();
    };
    ctx.globalAlpha = fade * 0.34;
    ctx.strokeStyle = '#eaf2ff';
    ctx.lineWidth = Math.max(2, arm * 0.5);

    ctx.globalAlpha = fade * 0.92;
    ctx.strokeStyle = '#0a0e15';
    ctx.lineWidth = Math.max(1.2, arm * 0.24);

  ctx.restore();

}

/* ---------------- what stands in the realm ---------------- */
/*
 * Close up the floor is only the floor, and everything standing on it is
 * drawn here instead: each thing as its own picture, sorted by how far down
 * the realm it stands so the near one passes in front of the far one, and
 * lifted by the height it carries so that what flies is seen to fly. Further
 * out there is no room to sort anything and the floor picture carries them
 * all flattened into it, which is why this only runs at the closest level.
 */
let things = null;
const thingArt = new Image();
if (A.things) {
  thingArt.src = BASE + 'things.png';
  fetch(BASE + 'things.json').then(r => r.json()).then(index =>
    fetch(BASE + 'things.bin').then(r => r.arrayBuffer()).then(buffer => {
      things = { index, at: new Uint16Array(buffer), reach: reachOf(index) };
    })).catch(() => { things = null; });
}

/*
 * How far the biggest thing in the sheet reaches past the tile it stands
 * on, in tiles.
 *
 * Needed to know what can be thrown away unseen, and worth measuring
 * rather than guessing: the widest cell is sixty-eight sheet pixels and
 * the largest a thing is drawn is 160 per cent, which together are nearly
 * seven tiles - so a foot three tiles outside the frame can still put a
 * shoulder inside it. Read off the sheet once, when it arrives.
 */

  let wide = 0, tall = 0, rise = 0;
  for (const pic of index.pics) {
    if (!pic) continue;

    tall = Math.max(tall, pic[3] * size);

// Reused between frames so a busy corner of the realm does not make garbage.
const standing = [];
const mob = [];

/*
 * How much scenery is worth one frame.
 *
 * The whole of the standing layer is one drawImage per piece, and on this
 * machine a piece costs about five microseconds however small it is - the
 * mean piece at the zoom where scenery arrives covers seventy pixels, so
 * nothing is being filled; it is the call itself. Measured on a 1920 by 1080
 * window at the moment the closest level comes in: thirty-two thousand
 * things scanned, seven thousand within the frame, five thousand three
 * hundred drawn, twenty-seven milliseconds. Two and a half more for the
 * scan and half for the sort - so ninety per cent of the frame is blits,
 * and there is no arithmetic to take out of it. The only thing that can be
 * done is to draw fewer.
 *
 * So the scenery is capped by how thickly it lies rather than by how much of
 * it there is. Every chunk is allowed the same number of pieces per tile,
 * and one that holds more than its share keeps a fixed fraction of them -
 * so a crowded wood thins out and open ground, which was never the problem,
 * is left exactly as it was. Because the allowance rises as the square of
 * the zoom and every chunk's thickness is a constant, the fraction only ever
 * grows as you come down: a piece that is being drawn stays drawn, and the
 * rest arrive as you get closer. Nothing is ever taken away in front of you,
 * and panning changes nothing at all.
 *
 * Which pieces are kept comes from a hash of where each one sits in the
 * file, so it is the same set every frame and the same set on every machine.
 * Anything drawn taller than THING_BIG is kept whatever the thickness: what
 * is being thinned is the clutter, not the landmarks, and at the zoom this
 * bites four fifths of the layer is one ten-pixel tuft.
 */
const THING_MANY = 2000;                 // pieces of scenery worth one frame
const THING_BIG = 13;                    // pixels tall; above this, always drawn
const THING_FINE = 4096;                 // how finely the fraction is cut

/* Kept or not, decided once and the same way every time. */
function thingRank(index) {
  let h = Math.imul(index ^ 0x9e3779b9, 2654435761);
  h ^= h >>> 15;

  h ^= h >>> 13;
  return (h >>> 0) % THING_FINE;
}

  if (!things || !thingArt.complete || !thingArt.naturalWidth) return null;
  if (levelFor(view.scale) !== 0) return null;

  const near = { x: seen.x0, y: seen.y0 }, far = { x: seen.x1, y: seen.y1 };

   * of things; the screen at this level holds a couple of hundred tiles
   * across. Collected by the chunk and sorted before anything was thrown
   * away, nineteen things in twenty were sorted, measured, placed and only
   * then discarded - twenty-nine thousand of them handled to draw thirteen
   * hundred. The bounds are asked first now, in the units the file is
   * written in, so that nothing has to be divided to answer.
   *

   * drawn upwards: the tallest stand six tiles high, so one whose foot is
   * under the bottom edge can still hang into view. Above the top edge a
   * foot cannot, since the body is above it - and `near` is already read

   * The allowance, in pieces per tile: the budget spread over as many
   * tiles as the window is showing. Four times as generous every time the
   * zoom doubles, which is what makes the thinning lift as you come down.
   */
  const tilesShown = (box.w / view.scale) * (box.h / view.scale);

   * The margin carries three things: half the widest thing, because a
   * thing is placed by the middle of its foot; its whole height on the
   * near side, because it is drawn upwards and one standing below the
   * bottom edge can still hang into view; and the forty screen pixels the
   * exact check further down tolerates, which this far in is several tiles
   * and was what the first attempt at this forgot. Losing twenty-four
   * things off the edges is what forgetting it looks like.

   * would always pass in front of it, and a monster standing behind a wall
   * would be drawn on top of the wall; sorted together, it is behind it.
   */
  mob.length = 0;
  for (const one of alive) {

  ctx.imageSmoothingEnabled = false;

    const x = a[at + 1] / 8, y = a[at + 2] / 8;
    while (m < mob.length && mob[m].y < y) living += drawOneLife(mob[m++], box);
    const pic = pics[a[at]];
    if (!pic) continue;
    const size = pic[4] / 100;
    const wide = pic[2] * size * perPixel;
    const tall = pic[3] * size * perPixel;
    // The line took a pixel of art all round, so it is put back down by that much.
    const foot = (pic[6] || 0) * size * perPixel;
    const on = place(x, y + 1, box);
    if (!on) continue;
    const w2 = wide * on.k, h2 = tall * on.k;
    if (on.x + w2 < -40 || on.x - w2 > box.w + 40) continue;
    if (on.y + h2 < -40 || on.y - h2 > box.h + 40) continue;
    /*
     * A thing with a run of frames plays it. A dungeon portal turns, a torch
     * gutters, a captured beacon pulses - the client says how many frames and
     * how long the whole run lasts, and the frames sit side by side in one
     * cell of the sheet, so playing one is a step along the row.
     */
    let sx = pic[0];
    const frames = pic[7] || 1;
    if (frames > 1) {

      sx += (Math.floor(time / (run / frames)) % frames) * pic[2];

    ctx.drawImage(thingArt, sx, pic[1], pic[2], pic[3],
      on.x - w2 / 2, on.y - h2 + foot * on.k - (pic[5] / 100) * view.scale * on.k, w2, h2);
    drawn++;

  return { stood: drawn, living };
}

const roads = new Image();
roads.src = BASE + 'roads.png';

/* ---------------- what lives there ---------------- */
/*
 * One creature to about twelve hundred tiles of its own patch, floored and
 * capped so a small zone is not empty and a vast one is not a swarm. They are
 * placed by sampling inside the patch's own bounds rather than the whole map,
 * which is what makes placing a thousand of them instant.
 */

// nearer to how a realm feels than the one in twelve hundred it was.
