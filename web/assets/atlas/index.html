const lifeArt = new Map();

function artFor(sprite) {
  let img = lifeArt.get(sprite.file);
  if (!img) {
    img = new Image();
    img.decoding = 'async';
    img.src = BASE + 'life/' + sprite.file;
    lifeArt.set(sprite.file, img);
  }
  return img;
}

/*
 * Whether creatures wander the map.
 *
 * They are not recorded positions - nothing walks the same path twice - so
 * they are sown from each zone's own cast, one every so many tiles, and they
 * drift about. It is the map's life, and it is off while the work on what
 * lives where is being done: a map with two and a half thousand creatures
 * strewn across it cannot be read for what the ground is doing, and the
 * monsters are going back on it once their behaviour, their spawners and
 * their drops are all in hand.
 *
 * Turning it back on is this one word. Nothing else has been taken out: the
 * sowing below, the drifting, the depth sorting and the portraits are all
 * still here and still built.
 */
const WANDERERS = false;

function populate() {
  alive.length = 0;
  if (!WANDERERS) return;
  for (const zone of A.zones) {
    if (!zone.lives || !zone.lives.length) continue;
    const [x0, y0, x1, y1] = zone.box;
    const wanted = perZone(zone.tiles);
    let placed = 0, tries = 0;
    while (placed < wanted && tries < wanted * 60) {
      tries++;
      const x = x0 + Math.random() * (x1 - x0 + 1);
      const y = y0 + Math.random() * (y1 - y0 + 1);
      // Its own patch, and ground it could actually stand on.
      if (!canStand(x, y, zone.id)) continue;
      const kind = zone.lives[Math.floor(Math.random() * zone.lives.length)];
      const angle = Math.random() * Math.PI * 2;
      alive.push({
        kind, home: zone.id, x, y,
        vx: Math.cos(angle) * 0.5, vy: Math.sin(angle) * 0.5,
        phase: Math.random() * 100
      });
      placed++;
    }
  }
  standUpLandmarks();
  countAt.textContent = alive.length + ' creatures and ' + landmarks.length
    + ' set pieces across ' + A.zones.length + ' zones';
}

/*
 * Where a creature may put its feet: inside its own patch, and on ground the
 * client says can be walked on. The second matters as much as the first - the
 * Deep Sea's patch takes in the ring of Craggle mountains around it, and
 * without asking, its wildlife strolls over the range that is there to keep
 * it in.
 */
/*
 * The ground a beacon stands on.
 *
 * Every beacon in the realm is planted on the same built plate - the
 * castle flagstones, a darker ring, a rug at the middle - and nothing
 * wanders across it.
 *
 * Its size and where it sits are read off the ground rather than guessed
 * at. The plate is identical at every beacon and the biome around it is
 * not, so for each offset from a beacon you can ask how many of the
 * forty-two show the same tile there: inside the plate better than three
 * quarters of them agree, and one tile outside it the agreement falls to
 * two per cent. What that draws is nineteen tiles square, reaching from
 * ten tiles west to eight east and thirteen north to five south - so the
 * position recorded for a beacon is not the middle of its own plate, but
 * a tile east and four south of it.
 *
 * (The very middle disagrees too, because a captured beacon and an active
 * one do not look alike and a guardian may be standing on it. That is
 * inside the plate all the same.)
 *
 * Held as the set of tiles the plates cover rather than as a distance to
 * be measured, because the walk asks this question up to three times per
 * creature per frame and there are forty-two plates it would otherwise
 * have to ask about every time.
 */
const BEACON_REACH = 9;
const BEACON_OFF_X = -1;
const BEACON_OFF_Y = -4;
const beaconGround = (() => {
  const held = new Set();
  for (const beacon of A.beacons) {
    const cx = beacon.x + BEACON_OFF_X, cy = beacon.y + BEACON_OFF_Y;
    for (let dy = -BEACON_REACH; dy <= BEACON_REACH; dy++) {
      for (let dx = -BEACON_REACH; dx <= BEACON_REACH; dx++) {
        held.add((cy + dy) * 4096 + cx + dx);
      }
    }
  }
  return held;
})();
const onBeaconGround = (x, y) => beaconGround.has(Math.floor(y) * 4096 + Math.floor(x));

function canStand(x, y, home) {
  if (zoneOf(x, y) !== home) return false;
  if (onBeaconGround(x, y)) return false;
  const here = atTile(x, y);
  return !(here && here.walled);
}

function stepLife(delta) {
  for (const one of alive) {
    one.phase += delta;
    const turn = (Math.random() - 0.5) * 0.4 * delta;
    const cos = Math.cos(turn), sin = Math.sin(turn);
    const vx = one.vx * cos - one.vy * sin;
    const vy = one.vx * sin + one.vy * cos;
    one.vx = vx; one.vy = vy;
    const nx = one.x + vx * delta, ny = one.y + vy * delta;
    if (canStand(nx, ny, one.home)) { one.x = nx; one.y = ny; continue; }
    if (canStand(nx, one.y, one.home)) { one.x = nx; one.vy = -one.vy; }
    else if (canStand(one.x, ny, one.home)) { one.y = ny; one.vx = -one.vx; }
    else { one.vx = -one.vx; one.vy = -one.vy; }
  }
}

/*
 * How far away a thing is worth seeing from.
 *
 * Zoomed right out the realm is a shape, and what matters about it is where
 * its set pieces are - so the encounters come up first, alone, at a scale
 * where a tile is a third of a pixel and nothing else could be read. The
 * Heroes of Oryx follow, then the ordinary wildlife, then the scenery, which
 * has its own level and does not appear until eight pixels to the tile.
 *
 * Which is also how the map stays cheap far out: thirty-odd landmarks
 * instead of thirteen hundred creatures and a hundred and eighty thousand
 * things.
 *
 * The wildlife used to come in at 1.4, which fitting the realm and then
 * turning the wheel five times reaches - so it was on the map almost
 * always and there was barely a band where the set pieces stood alone. At
 * 3 it takes nine turns, the rare things have the middle distance to
 * themselves, and the wildlife arrives at about the zoom where the ground
 * it is standing on becomes worth looking at.
 */
/*
 * What appears at what distance, as a staircase.
 *
 * Standing right back you get a world and nothing else - the point of being
 * that far away is to see the shape of it, and a realm dotted with its bosses
 * before you have come anywhere near tells you nothing you can use. So each
 * kind arrives as you come down, in the order of how much a thing matters
 * when you are looking for it: the encounters first, then the Heroes of Oryx,
 * then the wildlife, and last the scenery, which arrives with the ground it
 * stands on.
 *
 * None of them is at the furthest zoom, which is a little under nine tenths.
 */
const SHOW_ENCOUNTER = 0.85;
const SHOW_HERO = 1.7;
const SHOW_LIFE = 3;

/*
 * How tall a landmark is drawn, in tiles.
 *
 * An editorial choice, and it has to be, because nothing anywhere says how
 * big these are. The client would know, but not one encounter and only five
 * heroes were met during the walk, so their pictures come from the imported
 * catalogue - which is a sprite inside a square of transparency, and the
 * square is ninety pixels for one and four hundred for the next. Sizing
 * them from that would say nothing except how the picture was cropped.
 *
 * So they are drawn at a size that reads as a set piece against wildlife of
 * one and a half to six tiles, and the sprite inside the picture is measured
 * so the drawn size is the same whatever the square around it was.
 */
const LANDMARK_TILES = { encounter: 7, hero: 4.5 };

/*
 * And never smaller than this on the screen, whatever the zoom.
 *
 * Seven tiles is four pixels when the whole realm is in view, which is not
 * something you can see, let alone the first thing you see. Below the zoom
 * where its true size overtakes this, a set piece stops being a thing on the
 * ground and becomes a mark on a map - which is what it is for out there.
 * The beacons already work this way.
 */
const LANDMARK_LEAST = { encounter: 26, hero: 17 };

const landmarks = [];
const bossArt = new Map();

/*
 * The drawn part of a picture, in its own pixels, measured once when it
 * arrives. Canvas will decode a palette PNG, a greyscale one and a GIF
 * alike, which is the reason for measuring here rather than offline.
 */
function opaqueBox(img) {
  const off = document.createElement('canvas');
  off.width = img.naturalWidth; off.height = img.naturalHeight;
  const o = off.getContext('2d', { willReadFrequently: true });
  o.drawImage(img, 0, 0);
  const data = o.getImageData(0, 0, off.width, off.height).data;
  let x0 = off.width, y0 = off.height, x1 = -1, y1 = -1;
  for (let y = 0; y < off.height; y++) {
    for (let x = 0; x < off.width; x++) {
      if (!data[(y * off.width + x) * 4 + 3]) continue;
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) return { x: 0, y: 0, w: off.width, h: off.height };
  return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}

function bossFor(file) {
  let held = bossArt.get(file);
  if (held) return held;
  const img = new Image();
  img.decoding = 'async';
  held = { img, box: null };
  img.onload = () => { try { held.box = opaqueBox(img); } catch (error) { held.box = null; } };
  img.src = BASE + 'boss/' + file;
  bossArt.set(file, held);
  return held;
}

/*
 * A landmark has to be in the same place every time the atlas is opened - one
 * that wanders between visits is not a landmark - so they are placed from a
 * seed of the zone they belong to rather than from Math.random.
 */
function seeded(seed) {
  let held = seed >>> 0;
  return () => { held = (held * 1664525 + 1013904223) >>> 0; return held / 4294967296; };
}

/*
 * How many of a place's cast actually stand on the map.
 *
 * The panel lists everything a zone can hold, which is what a list is for.
 * The map is not a list: an encounter turns up once in a realm, so showing
 * every one a biome can produce would be showing a realm that has never
 * existed. One encounter to a place, and no more than one of any kind in the
 * whole realm; three Heroes of Oryx, which is about what a realm carries.
 */
const STAND_UP = { encounter: 1, hero: 3 };

function standUpLandmarks() {
  landmarks.length = 0;
  const alreadyInRealm = new Set();
  for (const zone of A.zones) {
    const roll = seeded(zone.id * 2654435761);
    const cast = [];
    for (const one of zone.encounters || []) cast.push({ one, role: 'encounter' });
    for (const one of zone.heroes || []) cast.push({ one, role: 'hero' });
    // Shuffled by the zone's own roll, so which ones stand is settled once
    // and does not change between visits.
    for (let i = cast.length - 1; i > 0; i--) {
      const j = Math.floor(roll() * (i + 1));
      const t = cast[i]; cast[i] = cast[j]; cast[j] = t;
    }
    const stoodUp = { encounter: 0, hero: 0 };
    const [x0, y0, x1, y1] = zone.box;
    for (const { one, role } of cast) {
      // No picture, or already walking about as wildlife: nothing to stand up.
      if (!one.art || one.onMap) continue;
      if (stoodUp[role] >= STAND_UP[role]) continue;
      if (role === 'encounter') {
        if (alreadyInRealm.has(one.name)) continue;
        alreadyInRealm.add(one.name);
      }
      for (let tries = 0; tries < 400; tries++) {
        const x = x0 + roll() * (x1 - x0 + 1), y = y0 + roll() * (y1 - y0 + 1);
        if (!canStand(x, y, zone.id)) continue;
        landmarks.push({ name: one.name, art: one.art, role, x, y, home: zone.id });
        stoodUp[role]++;
        break;
      }
    }
  }
}

/*
 * The set pieces, drawn over the ground rather than sorted into it: a thing
 * you are looking for should not go behind a tree.
 */
function drawLandmarks(box) {
  if (view.scale < SHOW_ENCOUNTER) return 0;
  const seen = seenRange(box, 60);
  const near = { x: seen.x0, y: seen.y0 }, far = { x: seen.x1, y: seen.y1 };
  let drawn = 0;
  for (const one of landmarks) {
    const from = one.role === 'encounter' ? SHOW_ENCOUNTER : SHOW_HERO;
    if (view.scale < from) continue;
    if (one.x < near.x || one.x > far.x || one.y < near.y || one.y > far.y) continue;
    const held = bossFor(one.art);
    if (!held.box) continue;
    const at = place(one.x, one.y, box);
    if (!at) continue;
    const tall = Math.max(LANDMARK_LEAST[one.role],
      LANDMARK_TILES[one.role] * view.scale) * at.k;
    const wide = tall * (held.box.w / held.box.h);
    // Softened only when it is being made smaller than its own picture;
    // blown up it stays square, like everything else on the map.
    ctx.imageSmoothingEnabled = tall < held.box.h;
    ctx.globalAlpha = Math.min(1, (view.scale - from) / (from * 0.9));
    ctx.drawImage(held.img, held.box.x, held.box.y, held.box.w, held.box.h,
      at.x - wide / 2, at.y - tall, wide, tall);
    drawn++;
  }
  ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = false;
  return drawn;
}

// One creature where it stands. Drawn either on its own, far out, or sorted
// in among the scenery close up.
function drawOneLife(one, box) {
  const img = artFor(one.kind.sprite);
  if (!img.complete || !img.naturalWidth) return 0;
  const sprite = one.kind.sprite;
  const frame = sprite.frames > 1 ? Math.floor(one.phase * 4) % sprite.frames : 0;
  // At the size the client draws it, not all at one size.
  const k = 1.5 * ((sprite.size || 100) / 100);
  const wide = (sprite.tile / (A.px * SS)) * view.scale * k;
  const tall = (sprite.height / (A.px * SS)) * view.scale * k;
  // The line took a pixel of art under its feet, so it is put back down by that much.
  const foot = (1 / A.px) * view.scale * k;
  const at = place(one.x, one.y, box);
  if (!at) return 0;
  const w2 = wide * at.k, h2 = tall * at.k;
  ctx.drawImage(img, frame * sprite.tile, 0, sprite.tile, sprite.height,
    at.x - w2 / 2, at.y - h2 + (foot + view.scale / 2) * at.k, w2, h2);
  return 1;
}

function drawLife(box) {
  if (view.scale < SHOW_LIFE) return 0;
  const fade = Math.min(1, (view.scale - SHOW_LIFE) / 1.2);
  const seen = seenRange(box, 60);
  const near = { x: seen.x0, y: seen.y0 }, far = { x: seen.x1, y: seen.y1 };
  ctx.globalAlpha = fade;
  ctx.imageSmoothingEnabled = false;
  let drawn = 0;
  for (const one of alive) {
    if (one.x < near.x || one.x > far.x || one.y < near.y || one.y > far.y) continue;
    drawn += drawOneLife(one, box);
  }
  ctx.globalAlpha = 1;
  return drawn;
}

/*
 * Which beacon the pointer is over, with a margin that does not shrink to
 * nothing when the whole realm is in view.
 */
function beaconUnder(px, py, box) {
  const reach = Math.max(9, Math.min(24, view.scale * 2.4));
  let near = null, best = reach * reach;
  for (const beacon of A.beacons) {
    const at = place(beacon.x, beacon.y, box);
    if (!at) continue;
    const d = (at.x - px) ** 2 + (at.y - py) ** 2;
    if (d < best) { best = d; near = beacon; }
  }
  return near;
}

/* ---------------- roads and beacons, quietly ---------------- */
function drawRoads(box) {
  if (!roads.complete || !roads.naturalWidth || !mask) return;
  const at = toScreen(B.minX, B.minY, box);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.12;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(roads, at.x, at.y, mask.w * view.scale, mask.h * view.scale);
  ctx.restore();
}

/*
 * A beacon is not marked. It stands in the realm and it looks like itself,
 * and a ring drawn over it only hid what it was. It answers to the pointer
 * instead - once you are close enough to be looking at one - by lighting up
 * from underneath, the way a place does, so you can see it is a thing you can
 * open without anything being painted across it the rest of the time.
 */
const BEACON_NEAR = 3;                  // close enough to be looking at one

function drawBeacons(box, time) {
  if (view.scale < BEACON_NEAR) return;
  const pulse = 1 + Math.sin(time / 620) * 0.1;
  for (const beacon of A.beacons) {
    const lit = beacon === chosenBeacon || beacon === hoveredBeacon;
    if (!lit) continue;
    const at = place(beacon.x, beacon.y, box);
    if (!at) continue;
    if (at.x < -60 || at.y < -60 || at.x > box.w + 60 || at.y > box.h + 60) continue;
    // Foreshortened round the curve of the world, and never less than a
    // pixel: a radius has to be positive, and one frame of a bad one used
    // to take the whole loop down with it.
    const r = Math.max(1, Math.max(14, view.scale * 2.6) * (at.k || 0) * pulse);
    const warm = beacon === chosenBeacon ? [255, 203, 112] : [180, 232, 255];

    ctx.save();
    // A pool of shade under it first, so it reads as standing a little proud.
    ctx.globalAlpha = 0.5;
    const shade = ctx.createRadialGradient(at.x, at.y + r * 0.45, 0, at.x, at.y + r * 0.45, r);
    shade.addColorStop(0, 'rgba(2,4,8,.85)');
    shade.addColorStop(1, 'rgba(2,4,8,0)');
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(at.x, at.y + r * 0.45, r, 0, Math.PI * 2); ctx.fill();

    // Then the light, added rather than painted on.
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 1;
    const glow = ctx.createRadialGradient(at.x, at.y - r * 0.15, 0, at.x, at.y - r * 0.15, r);
    const rgb = warm[0] + ',' + warm[1] + ',' + warm[2];
    glow.addColorStop(0, 'rgba(' + rgb + ',.34)');
    glow.addColorStop(0.55, 'rgba(' + rgb + ',.16)');
    glow.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(at.x, at.y - r * 0.15, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* ---------------- names of places ---------------- */
/*
 * Nothing is labelled until it is asked about.
 *
 * A hundred names scattered over the ground is a legend printed on the map,
 * and it hides the thing it describes - which here is the realm itself, drawn
 * tile for tile. So only the patch under the pointer, or the one that has been
 * opened, is named, and it is named where it is rather than in a list.
 */
function drawNames(box) {
  const named = chosenBeacon || (view.scale >= BEACON_NEAR ? hoveredBeacon : null);
  if (named) {
    const at = place(named.x, named.y, box) || { x: -999, y: -999 };
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.font = '600 13px ui-monospace, Consolas, monospace';
    ctx.globalAlpha = 0.6; ctx.lineWidth = 4; ctx.strokeStyle = '#05080d';
    ctx.strokeText(named.name, at.x, at.y - 14);
    ctx.globalAlpha = 1; ctx.fillStyle = '#ffe6b0';
    ctx.fillText(named.name, at.x, at.y - 14);
    return;
  }
  const show = chosen || hovered;
  if (!show) return;
  const zone = zoneById.get(show);
  if (!zone) return;
  const at = place(zone.at[0], zone.at[1], box);
  if (!at || at.x < 0 || at.y < 0 || at.x > box.w || at.y > box.h) return;
  /*
   * Sized without rounding, which is the whole of why it used to shake.
   *
   * The size follows the zoom, and the zoom eases rather than stepping - so
   * rounding the size to whole pixels turned a smooth sweep into thirteen,
   * fourteen, fifteen. Every step changed how wide the word was, and a word
   * drawn from its middle moves both its ends when it changes width, so it
   * twitched left and right all the way in. Two decimals is still one string
   * per frame and the width now changes as smoothly as the distance does.
   */
  const scale = Math.max(13, Math.min(22, Math.sqrt(zone.tiles) * view.scale * 0.06));
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '600 ' + scale.toFixed(2) + 'px ui-monospace, Consolas, monospace';
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = 4; ctx.strokeStyle = '#05080d';
  ctx.strokeText(zone.name, at.x, at.y);
  ctx.globalAlpha = 1;
  ctx.fillStyle = show === chosen ? '#ffe6b0' : '#e8eef8';
  ctx.fillText(zone.name, at.x, at.y);
}

/* ---------------- the panel ---------------- */
/*
 * A row of creatures with their pictures, used by both panels.
 */
function livesList(list) {
  if (!list || !list.length) return '<p class="sub">Nothing was met here.</p>';
  return '<div class="life">' + list.map(one => {
    const s = one.sprite;
    const k = Math.max(2, Math.min(6, Math.round(30 / s.height)));
    const style = 'width:' + (s.tile * k) + 'px;height:' + (s.height * k) + 'px;'
      + 'background-image:url(' + BASE + 'life/' + s.file + ');'
      + 'background-size:' + (s.tile * s.frames * k) + 'px 100%;'
      + '--w:' + (s.tile * s.frames * k) + 'px;--steps:' + s.frames + ';'
      + '--time:' + (s.frames * 0.24).toFixed(2) + 's';
    return '<div><span class="art' + (s.frames > 1 ? ' runs' : '') + '" style="' + style + '"></span>'
      + '<b>' + one.name + '</b><em>' + one.seen + '</em></div>';
  }).join('') + '</div>';
}

/*
 * A beacon is inside a place without being of it. It has its own guardian and
 * its own fight, and someone looking for one is not looking for the forest it
 * happens to stand in - so it answers to a click in its own right, and says
 * which place it is in rather than being swallowed by it.
 */
let chosenBeacon = null;
let hoveredBeacon = null;
function openBeacon(beacon) {
  chosen = 0;
  chosenBeacon = beacon;
  const zone = zoneById.get(beacon.zone);
  panelBody.innerHTML = '<h2>' + beacon.name + ' Beacon</h2>'
    + '<p class="sub">' + beacon.state + ' · at ' + beacon.x + ', ' + beacon.y + '</p>'
    + '<div class="facts">'
    + '<span><i>standing in</i> ' + (zone ? zone.name : 'unclaimed ground') + '</span>'
    + '<span><i>guardians met</i> ' + (beacon.guards || []).length + '</span>'
    + '</div>'
    + (beacon.guardian
      ? '<h3>Guardian</h3>'
        + castList([beacon.guardian.name ? beacon.guardian : { name: beacon.guardian }])
      : '')
    /*
     * The ground's other guardians, if it has any this one is not. A beacon
     * whose guardian is the only one its ground has would otherwise print it
     * twice, once under each heading.
     */
    + (() => {
      const mine = beacon.guardian && (beacon.guardian.name || beacon.guardian);
      const rest = ((zone && zone.guardians) || []).filter(one => one.name !== mine);
      return rest.length
        ? '<h3>Others on this ground<span>' + rest.length + '</span></h3>' + castList(rest) : '';
    })()
    + '<h3>Standing round it<span>' + (beacon.guards || []).length + '</span></h3>'
      + livesList(beacon.guards);
  panel.classList.add('is-open');
}

/*
 * A row of pictures for a part of the cast.
 *
 * An encounter and a Hero of Oryx are not in the walked recording at all -
 * the things a realm is visited for are exactly the things a stroll through
 * it does not meet - so they come from the imported reference, with pictures
 * cut from the client and carried into the atlas beside it.
 */
function castList(list, note) {
  if (!list || !list.length) return '';
  return '<div class="life">' + list.map(one => {
    const art = one.art
      ? '<img class="face" src="' + BASE + 'boss/' + one.art + '" alt="" loading="lazy">'
      : '<span class="face"></span>';
    /*
     * What it is worth going after. Hit points and defence say how long it
     * takes, experience says what it is worth; a thing with none of the three
     * simply does not show a line, rather than showing three dashes.
     */
    const facts = [
      one.hp !== undefined ? Number(one.hp).toLocaleString() + ' hp' : '',
      one.def !== undefined ? one.def + ' def' : '',
      one.exp !== undefined ? Number(one.exp).toLocaleString() + ' xp' : ''
    ].filter(Boolean).join(' \u00b7 ');
    return '<div>' + art + '<b>' + one.name + '</b>'
      + (facts ? '<u class="stat">' + facts + '</u>' : '')
      + (one.onMap ? '<i>on the map</i>' : '')
      + (note ? '<em>' + note + '</em>' : '') + '</div>';
  }).join('') + '</div>';
}

/*
 * What can fall in a place.
 *
 * The useful half of a drop table is not the list of names but the tiers: a
 * place is worth walking into because tier eleven armour falls in it, not
 * because a health potion does. So the tiers of each kind of gear are drawn
 * as a run - eight to twelve - and everything that is a named thing rather
 * than a tier follows underneath.
 */
const GEAR = ['Weapons', 'Alternate Weapons', 'Armor', 'Rings', 'Abilities'];
function lootList(loot) {
  if (!loot) return '';
  const art = file => BASE + 'loot/' + file;

  /*
   * A tier line is not an item and cannot be given an item's picture: "Tier 8
   * Weapons" is a hundred different swords. What it can be given is the icon
   * of the slot it goes in, which is the thing the reader is actually asking
   * about - what can I put in my weapon hand from here, and how good - so the
   * slot icon carries the run from the lowest tier that falls to the highest.
   */
  const kinds = Object.keys(loot.tiers)
    .sort((a, b) => (GEAR.indexOf(a) + 1 || 99) - (GEAR.indexOf(b) + 1 || 99));
  const rows = kinds.map(kind => {
    const t = loot.tiers[kind];
    const slot = (loot.slots || {})[kind];
    const icon = slot ? '<img class="slot" src="' + art(slot) + '" alt="" loading="lazy">'
      : '<span class="slot"></span>';
    return '<div>' + icon + '<b>' + kind + '</b>'
      + '<em>' + t[0] + (t.length > 1 ? '<u>\u2013</u>' + t[t.length - 1] : '') + '</em></div>';
  }).join('');

  // The things that have a picture of their own, each under it.
  const shelf = (title, list) => (list && list.length)
    ? '<h4>' + title + '</h4><div class="haul">' + list.map(one =>
      '<figure><img src="' + art(one.art) + '" alt="" loading="lazy">'
      + '<figcaption>' + one.name + '</figcaption></figure>').join('') + '</div>'
    : '';

  return '<div class="tiers">' + rows + '</div>'
    + shelf('Dungeons', loot.dungeons)
    + shelf('Named gear', loot.gear)
    + ((loot.items || []).length
      ? '<p class="drops">' + loot.items.map(one => '<span>' + one + '</span>').join('') + '</p>'
      : '');
}

function openZone(id) {
  const zone = zoneById.get(id);
  if (!zone) return;
  chosen = id;
  chosenBeacon = null;
  const beacons = A.beacons.filter(b =>
    b.x >= zone.box[0] && b.x <= zone.box[2] && b.y >= zone.box[1] && b.y <= zone.box[3]).length;
  const wide = zone.box[2] - zone.box[0] + 1, tall = zone.box[3] - zone.box[1] + 1;

  const here = A.beacons.filter(b =>
    b.x >= zone.box[0] && b.x <= zone.box[2] && b.y >= zone.box[1] && b.y <= zone.box[3]);
  const said = {
    ground: 'from the ground it is laid with',
    roads: 'from the roads that cross it',
    creatures: 'from the creatures that live in it',
    walked: 'by someone who has walked it'
  }[zone.from] || ('zone ' + zone.id + ', still unnamed');
  const rank = zone.rank || '';
  const badge = rank
    ? '<div class="rank ' + (/rookie/i.test(rank) ? 'rookie'
      : /veteran/i.test(rank) ? 'veteran'
      : /seasonal/i.test(rank) ? 'seasonal' : 'other') + '">' + rank + '</div>'
    : '';

  const roster = (title, list, note) => (list && list.length)
    ? '<h3>' + title + '<span>' + list.length + '</span></h3>' + castList(list, note) : '';

  panelBody.innerHTML = '<h2>' + zone.name + '</h2>'
    + '<p class="sub">' + zone.tiles.toLocaleString() + ' tiles, ' + wide + ' by ' + tall
    + ' &middot; named ' + said + '</p>'
    + badge
    + '<div class="facts">'
    + '<span><i>beacons</i><b>' + here.length + '</b></span>'
    + '<span><i>ground</i><b>' + (zone.ground || '&mdash;') + '</b></span>'
    + '<span><i>middle</i><b>' + zone.at[0] + ', ' + zone.at[1] + '</b></span>'
    + '<span><i>kinds met</i><b>' + (zone.lives ? zone.lives.length : 0) + '</b></span>'
    + '</div>'

    /*
     * The roster first, because it is the answer to what lives here. It comes
     * from the reference rather than from the walk: the things a realm is
     * visited for are exactly the things a stroll through it does not meet.
     */
    + roster('Encounters', zone.encounters)
    + roster('Heroes of Oryx', zone.heroes)
    + roster('Monsters', zone.regular)
    + roster('Beacon guardians', zone.guardians)

    /*
     * And it ends here. What used to follow - the beacons of the place, and
     * everything met while walking it - said the same things over again in
     * different words: the guardian was already under its own heading, and
     * the walk's list is the roster with the client's names on it instead of
     * the reference's, which reads as twice as many creatures as there are.
     */
    + (zone.loot ? '<h3>What falls here</h3>' + lootList(zone.loot) : '');
  panel.classList.add('is-open');
}
function shutPanel() { chosen = 0; chosenBeacon = null; panel.classList.remove('is-open'); }
document.getElementById('shut').addEventListener('click', shutPanel);

/* ---------------- the frame ---------------- */
let last = performance.now();
/*
 * The ground, laid onto the globe.
 *
 * Drawn flat first, onto a canvas wider and taller than the screen, because
 * the near face pulls in a great deal more chart than a flat view of the
 * same window would hold. Then read back a band of rows at a time.
 *
 * A band cannot be laid down in one piece. Latitude only bends rows up and
 * down, which a band handles, but longitude enters as its sine - the middle
 * of the face is stretched and the edges are crowded - so within a band the
 * chart has to be taken in several pieces, each stretched by its own
 * amount. How many pieces comes from how much of a turn is actually on
 * screen, so a close view takes one piece per band and pays nothing for
 * being on a globe at all.
 *
 * How deep a band is comes from the same question, asked of latitude, and is
 * worked out band by band where the loop reaches it.
 */

/*
 * How near the truth a band has to be, in screen pixels.
 *
 * Each piece of a band is a straight stretch standing in for a piece of a
 * sine curve, and a chord of angular width d departs from its arc by about
 * r*d*d/8 - so the width that keeps it inside half a pixel is the square
 * root of four over the radius. This matters more than it sounds: the
 * creatures and the scenery are put where the exact projection says, so a
 * band that is off by seven pixels stands its trees seven pixels off their
 * own ground. A fixed number of pieces got that wrong in the middle
 * distance and wasted them at the far end.
 */
/*
 * How true the bending has to be, and how deep a band of it is.
 *
 * Both are loosened when nothing is standing on the ground. The tolerance is
 * tight because the creatures and the scenery are placed by the exact
 * projection, so a band that is off by seven pixels stands its trees seven
 * pixels off their own ground - but that only matters where there are trees.
 * Below the zoom at which anything is placed the disc is scenery on its own,
 * nobody can measure it, and it can be built out of a quarter as many pieces.
 */
const SPHERE_TRUE = 0.5;
const SPHERE_LOOSE = 3;
const globePlain = () => view.scale < SHOW_LIFE;

/*
 * The warped world, kept until something about it changes.
 *
 * Laying a hemisphere down takes a couple of thousand small pieces, which
 * is worth doing once and not sixty times a second. Nothing in the ground
 * layer moves at these zooms - the drifting water is lifted out only at the
 * closest level, and the lit patch changes when the pointer does - so the
 * finished disc is kept and blitted whole until the view, the window or the
 * highlight is different.
 */
const globeKept = document.createElement('canvas');
const globeKeptCtx = globeKept.getContext('2d');
let globeKeptKey = null;
let globeKeptGround = null;

/*
 * The ground, straight onto the screen. Close in the world is flat to less
 * than half a pixel and there is nothing to bend it round.
 */
/*
 * The realm stays in front of you.
 *
 * The world is a ball of empty ocean with one island on it, and there is
 * nothing to be had from drifting off over the water until the island is
 * behind the curve. So the middle of the view is held inside the realm, with
 * as much slack as there is realm left once the window has taken its share -
 * and that slack falls to nothing as you pull back, so zooming out always
 * ends up looking at the realm rather than at wherever you happened to be.
 */

/*
 * How far back you may stand.
 *
 * Once the whole world is on the screen there is nothing further to see, and
 * pulling back past that only makes it smaller: at the old floor the planet
 * came to seventy pixels in the middle of an empty black field, which reads
 * as the map having vanished rather than as being very far away. So the
 * furthest is the distance at which the world about fills the window.
 */
const FURTHEST = 0.22;                   // of the shorter side, filled by the world
const floorZoom = box => FURTHEST * Math.min(box.w, box.h) / PLANET;

/*
 * A pin in the middle of the glass.
 *
 * The question of whether you have lost the realm was being answered by
 * measuring how much of it was on the screen, weighed by how square-on it
 * was, counted twice and compared - and it was wrong twice over before it was
 * right. The simple question turns out to be the right one: what is directly
 * under the middle of the window? If the answer is open ocean then you are
 * looking at nothing, whatever else is at the edges of the frame, and the
 * view should drift back until the middle of the realm is under the pin
 * again.
 *
 * The middle of the window is always exactly the point the camera is over,
 * in every mode - flat, leaning, or round - so no projection needs asking.
 * And the chart already knows what is at a tile: everything that was walked
 * carries a biome, and everything that was not is 255.
 */
const NOWHERE = 255;                     // the chart's word for unwalked water

// Where the map opens, and where it drifts back to.
function homeView(box) {
  const f = A.focus || [B.minX, B.minY, B.maxX, B.maxY];
  const room = Math.min(Math.max(1, box.w), Math.max(1, box.h - 34));
  return {
    x: (f[0] + f[2]) / 2,
    y: (f[1] + f[3]) / 2,
    scale: Math.max(0.02, (room / (PLANET * 2)) * 0.92)
  };
}

function overOcean() {
  const here = atTile(view.x, view.y);
  return !here || here.biome === NOWHERE;
}

/*
 * Coming home is a walk, not a step - and it waits to be sure you have
 * stopped.
 *
 * Asking every frame whether the pin is over water, and drifting only while
 * the answer is yes, ended the walk the moment the answer changed - and the
 * first thing the pin meets coming in from open sea is the coast. So the view
 * came back as far as the edge of the map and stopped there, with the realm
 * hanging off one side of the window: rescued from looking at nothing and
 * left looking at a corner. The question is asked once, to start the walk,
 * and after that the walk finishes what it began.
 *
 * But starting it the instant the pin crossed into open water was worse than
 * the bug it fixed. Pushing out over the sea to look at the coast from
 * outside, or panning across open water on the way to somewhere else, is a
 * thing you do on purpose, and the camera hauling itself back mid-gesture
 * reads as the map fighting you. So it waits for three seconds of stillness
 * first, and stillness means the view has actually stopped: no hand on it, no
 * wheel just turned, and the easing settled. Look at open water as long as
 * you like, so long as you are looking.
 *
 * Once walking, a hand or the wheel ends it, and it re-arms by itself after
 * another three seconds - because being taken somewhere you did not ask for
 * is worse than being lost.
 */
const HOME_AFTER = 3;                    // seconds of stillness before it walks back
let walkingHome = false;
let resting = 0;                         // seconds since the view last moved

/*
 * The shape of the window, as it was last frame.
 *
 * A box that grows raises the floor with it, and a zoom that was fine under
 * the old floor is under the new one - at which point the clamp below puts
 * it exactly on the floor, which is the one distance the map is not meant to
 * sit at, because that is where he is. Embedded in a panel that opens out to
 * four times its size, that happened every time. So a box that has changed
 * shape and left the zoom below its floor gets a fresh fit instead of a
 * clamp: it is the window that invalidated the view, not the reader.
 */
const lastBox = { w: 0, h: 0 };

function keepInSight(box, delta) {
  const least = floorZoom(box);
  if (box.w !== lastBox.w || box.h !== lastBox.h) {
    lastBox.w = box.w; lastBox.h = box.h;
    if (want.scale < least && lastBox.w > 1) settleInto(box);
  }
  /*
   * The one limit kept: pulled back past the point where the world fills the
   * window there is nothing further to see, only a smaller world.
   */
  if (want.scale < least) want.scale = least;
  if (view.scale < least) view.scale = least;

  if (from) { walkingHome = false; resting = 0; return; }   // a hand on it
  if (!mask) return;

  /*
   * Still, in the units that matter: half a pixel on the glass rather than
   * half a tile, since a tile is a different distance at every zoom and the
   * easing closes the last of any gap by ever smaller fractions for ever.
   */
  if (!walkingHome) {
    const near = 0.5 / Math.max(1e-6, view.scale);
    const settling = Math.abs(want.x - view.x) > near
      || Math.abs(want.y - view.y) > near
      || Math.abs(want.scale / Math.max(1e-6, view.scale) - 1) > 0.002;
    resting = settling ? 0 : resting + delta;
    if (resting >= HOME_AFTER && overOcean()) { walkingHome = true; resting = 0; }
  }
  if (!walkingHome) return;

  const home = homeView(box);
  const step = Math.min(1, delta * 0.7);
  want.x += (home.x - want.x) * step;
  want.y += (home.y - want.y) * step;
  /*
   * Arrived when what is left to close is under a couple of pixels, reckoned
   * in pixels for the same reason as above.
   */
  const close = 2 / Math.max(1e-6, view.scale);
  if (Math.abs(home.x - want.x) < close && Math.abs(home.y - want.y) < close) {
    want.x = home.x; want.y = home.y;
    walkingHome = false;
    resting = 0;
  }
}

/*
 * Swinging the camera round, on a and e as the game has it. This goes out
 * with the map; the slider on the bench is the same number seen another way
 * and is kept in step when there is one, which there is not once the bench
 * has been cut out of a published copy.
 */
const TURN_STEP = 6;
function turnBy(by) {
  let t = TUNE.turn + by;
  while (t > 180) t -= 360;
  while (t < -180) t += 360;
  TUNE.turn = t;
  const slider = document.getElementById('benchTurn');
  if (slider) {
    slider.value = Math.max(-90, Math.min(90, Math.round(t)));
    const said = document.getElementById('benchTurnAt');
    if (said) said.textContent = Math.round(t) + '\u00b0';
  }
}

/*
 * The ocean, under the flat view as well.
 *
 * This is where the map went black. Zoom past the point the world stops
 * being worth bending and the disc goes with it - and with the disc went the
 * only sea the page ever painted, because the sea was drawn inside it. Over
 * land nothing showed, which is why it stood so long; over open water there
 * was nothing to draw at all and the map fell through to the night behind
 * everything. Flat only ever happens when the world is many times the size
 * of the window, so no space can be in view and the whole canvas is sea
 * until the chart says otherwise.
 */
function groundFlat(box, now) {
  seaInk(ctx, box);
  ctx.fillRect(0, 0, box.w, box.h);
  const ground = drawGround(box);
  drawWater(box, now);
  drawRoads(box);
  if (chosen) drawLit(box, chosen, 0.16);
  else if (hovered) drawLit(box, hovered, 0.1);
  return ground;
}

function groundGlobe(box, now) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const level = levelFor(view.scale);
  /*
   * On the ball the water holds still, so the disc can always be kept.
   *
   * The ground layer is a still picture at every level but the closest,
   * where the water drifts - and one drifting tile is enough to throw away
   * the whole disc, which is a couple of thousand small pieces to lay down
   * again. So the water is given a fixed moment while the world is round.
   * It starts moving the instant the world goes flat, which is also the
   * point at which you are close enough to look at a single tile of it, and
   * flat costs nothing to redraw.
   *
   * On a window small enough that the changeover happens before the closest
   * level this changes nothing at all. It is here for the large ones, where
   * the world stays worth bending well past that point.
   */
  const still = true;
  /*
   * The disc is built at the screen's own grain. Building it at half of that
   * saved a good deal of fill and made the whole map soft, which is not a
   * trade worth making for a map: the point of it is to be read. The saving
   * that mattered was never the fill - it was the number of pieces the bend
   * is made of, and that is loosened below.
   */
  const plain = globePlain();
  const grain = dpr;
  const key = still ? [Math.round(view.x * 8), Math.round(view.y * 8),
    Math.round(view.scale * 4096), hovered, chosen, box.w, box.h, arrived,
    TUNE.turn].join() : null;
  if (still && key === globeKeptKey && globeKeptGround) {
    ctx.drawImage(globeKept, 0, 0, box.w, box.h);
    return globeKeptGround;
  }
  const R = globe();
  /*
   * How much flat chart has to be drawn to fill this window.
   *
   * Asked the other way round: the corner of the window is at some latitude
   * and longitude, and the chart is needed out to there and no further.
   * Close in that is the window itself to within a pixel; far out it is a
   * quarter turn of the world in each direction. Getting this wrong the
   * generous way asks for a canvas thirty thousand pixels on a side and the
   * page simply stops.
   */
  const wide9 = R / BULGE;
  const latMax = Math.asin(Math.min(1, (box.h / 2) / wide9));
  const cosLatMin = Math.max(1e-3, Math.cos(latMax));
  const lonMax = Math.asin(Math.min(1, (box.w / 2) / (wide9 * cosLatMin)));
  // Turned, the corners of the chart swing outside the square it covered.
  const swung = turning() ? Math.SQRT2 : 1;
  const reachX = Math.min(wide9 * Math.PI / 2, (wide9 * lonMax + 2) * swung);
  const reachY = Math.min(wide9 * Math.PI / 2, (wide9 * latMax + 2) * swung);
  const wide = Math.min(4096, Math.ceil(reachX * 2));
  const tall = Math.min(4096, Math.ceil(reachY * 2));
  if (globeMap.width !== Math.round(wide * grain) || globeMap.height !== Math.round(tall * grain)) {
    globeMap.width = Math.round(wide * grain);
    globeMap.height = Math.round(tall * grain);
  }
  globeCtx.setTransform(grain, 0, 0, grain, 0, 0);
  globeCtx.clearRect(0, 0, wide, tall);

  const big = { w: wide, h: tall };
  const real = ctx;
  ctx = globeCtx;
  /*
   * Turned with the world, not instead of it. The chart is spun about its own
   * middle before it is bent onto the ball, which is the same order the
   * things standing on it are put through - so the camera swings round the
   * planet rather than sliding a flat picture about underneath it.
   */
  globeCtx.save();
  const S = spin();
  if (S) {
    globeCtx.translate(wide / 2, tall / 2);
    globeCtx.rotate(TUNE.turn * Math.PI / 180);
    globeCtx.translate(-wide / 2, -tall / 2);
  }
  const ground = drawGround(big);
  drawWater(big, still ? 0 : now);
  drawRoads(big);
  if (chosen) drawLit(big, chosen, 0.16);
  else if (hovered) drawLit(big, hovered, 0.1);
  /*
   * There used to be a gradient here, rubbing the chart's edge away into the
   * ocean painted past it. It is gone, and its going is the end of a long
   * argument.
   *
   * It was there because the join showed, and the join showed because the
   * chart is mottled tile by tile and flat paint is not. Three sessions
   * aimed that gradient at three different places - the recorded bounds, the
   * chunk grid, and neither was where the ground actually ends, which is
   * wherever the recording stopped. Aimed anywhere but there it does harm
   * rather than good: it thins a band of real recorded sea, which puts two
   * new edges into the water where there was one.
   *
   * The paint carries the grain now, so there is nothing left to blend: same
   * colour, same grain, same pitch at every zoom. Measured across all four
   * edges, the sea is one surface with no step in it. A gradient over that
   * can only make it worse, so there is not one.
   */
  globeCtx.restore();
  ctx = real;

  // The disc is built on a canvas of its own so that it can be kept.
  if (globeKept.width !== Math.round(box.w * grain) || globeKept.height !== Math.round(box.h * grain)) {
    globeKept.width = Math.round(box.w * grain);
    globeKept.height = Math.round(box.h * grain);
  }
  globeKeptCtx.setTransform(grain, 0, 0, grain, 0, 0);
  globeKeptCtx.clearRect(0, 0, box.w, box.h);
  const screen = ctx;
  ctx = globeKeptCtx;

  const cx = box.w / 2, cy = box.h / 2;
  ctx.save();
  // Everything from here on belongs to the disc.
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.clip();

  // Ocean first, so the chart has water to sit in wherever nothing was
  // recorded - which past the eighty tiles of sea is everywhere.
  seaInk(ctx, box);
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);

  ctx.imageSmoothingEnabled = true;
  const top = Math.max(-R, -cy), bottom = Math.min(R, box.h - cy);
  const trueTo = plain ? SPHERE_LOOSE : SPHERE_TRUE;
  /*
   * How deep a band of the world can be and still be laid down straight.
   *
   * It used to be three pixels, everywhere, and three pixels is the right
   * answer in exactly one place: the far view, where the disc is small and
   * the ground near the limb turns away almost vertically. Everywhere else
   * it is far too careful. Come in to five tiles a pixel and the world is
   * twelve thousand pixels across, the window covers a thirtieth of a
   * radian of it, and the curve across that is measured in thousandths of a
   * pixel - and it was being taken in three-pixel slices, three hundred and
   * sixty of them, thirteen pieces each: four and a half thousand strips a
   * frame to draw a patch of ground that is flat to a hair. On a 1080 window
   * that came to ten to twelve milliseconds of every frame spent panning,
   * and thirty-three at the zoom where the scenery arrives on top of it.
   *
   * So the depth is chosen the way the width beside it already is: from how
   * far the straight version leaves the true one. Two things pull it in, and
   * the smaller wins.
   *
   * The first is the bend down the band. A straight stretch leaves the true
   * projection by about the square of the depth over eight, times the
   * curvature of latitude against screen - so the depth that keeps that
   * inside the tolerance is the square root of eight times the tolerance
   * over that curvature.
   *
   * The second is subtler and it is what a naive version of this gets wrong.
   * The whole band is drawn at one cos(lat), which sets how much longitude
   * is squeezed across it - so a deep band squeezes its top and bottom by an
   * amount that belongs to its middle. That error is the tangent of the
   * latitude, times the depth, times how far round the band the window
   * reaches, halved. Near the equator it is nothing and the first bound
   * rules; out towards the limb it is everything, and it is the reason the
   * far view still gets its two-pixel bands.
   *
   * Both are read at the deeper end of the band rather than at its start,
   * since walking outwards from the middle the curvature ahead is always
   * worse than the curvature behind. One guess and one correction is enough:
   * the bound falls off smoothly and the correction only ever shortens.
   */
  const STEP_MOST = 64;                  // and no band deeper than this
  const deepEnough = yAt => {
    const s = Math.min(0.9995, Math.abs(yAt) / wide9);
    const flat = Math.sqrt(Math.max(1e-9, 1 - s * s));
    const curve = (s / wide9) / (flat * flat * flat);
    const byBend = curve > 1e-12 ? Math.sqrt(8 * trueTo / curve) : STEP_MOST;
    const tan = s / flat;
    const round = Math.min(1, Math.max(cx, box.w - cx) / Math.max(1e-6, wide9 * flat));
    const bySqueeze = tan * round > 1e-9 ? (2 * trueTo) / (tan * round) : STEP_MOST;
    return Math.max(1, Math.min(STEP_MOST, byBend, bySqueeze));
  };
  for (let y = Math.floor(top); y < bottom; ) {
    const guess = deepEnough(y);
    const step = Math.min(guess, deepEnough(y + guess));
    const y2 = Math.min(y + step, bottom);
    const lat = Math.asin(Math.max(-1, Math.min(1, y / wide9)));
    const lat2 = Math.asin(Math.max(-1, Math.min(1, y2 / wide9)));
    const cosLat = Math.cos((lat + lat2) / 2);
    // Stepping on before any of these, because the loop no longer does it.
    if (cosLat < 0.02) { y = y2; continue; }
    const sv = wide9 * lat, sv2 = wide9 * lat2;
    // The stretch of longitude this band of the screen covers.
    const half = wide9 * cosLat;
    const fromX = Math.max(-half, -cx), toX = Math.min(half, box.w - cx);
    if (toX <= fromX) { y = y2; continue; }
    const lonAt = px => Math.asin(Math.max(-1, Math.min(1, px / half)));
    const lon0 = lonAt(fromX), lon1 = lonAt(toX);
    const widest = Math.sqrt(4 * trueTo / half);
    const pieces = Math.max(1, Math.min(48, Math.ceil((lon1 - lon0) / widest)));
    for (let p = 0; p < pieces; p++) {
      const a = lon0 + (lon1 - lon0) * p / pieces;
      const b = lon0 + (lon1 - lon0) * (p + 1) / pieces;
      const dx0 = half * Math.sin(a), dx1 = half * Math.sin(b);
      const su0 = wide9 * a, su1 = wide9 * b;
      if (dx1 - dx0 < 0.05) continue;
      ctx.drawImage(globeMap,
        (wide / 2 + su0) * grain, (tall / 2 + sv) * grain,
        Math.max(1, (su1 - su0) * grain), Math.max(1, (sv2 - sv) * grain),
        cx + dx0, cy + y, dx1 - dx0, Math.max(1, y2 - y));
    }
    y = y2;
  }
  ctx.imageSmoothingEnabled = false;

  /*
   * The edge of a lit sphere is darker than the middle of it, and there is
   * a little air above it. Both are drawn only when the world is small
   * enough on screen for an edge to be in view at all.
   */
  if (R < Math.max(box.w, box.h) * 1.6) {
    const limb = ctx.createRadialGradient(cx, cy, R * 0.55, cx, cy, R);
    limb.addColorStop(0, 'rgba(0,0,0,0)');
    limb.addColorStop(0.75, 'rgba(2,5,12,.22)');
    limb.addColorStop(1, 'rgba(1,3,8,.72)');
    ctx.fillStyle = limb;
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  }
  ctx.restore();

  if (R < Math.max(box.w, box.h) * 1.6) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const air = ctx.createRadialGradient(cx, cy, R * 0.96, cx, cy, R * 1.06);
    air.addColorStop(0, 'rgba(96,150,220,0)');
    air.addColorStop(0.45, 'rgba(110,168,235,.30)');
    air.addColorStop(1, 'rgba(96,150,220,0)');
    ctx.fillStyle = air;
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.06, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  ctx = screen;
  ctx.drawImage(globeKept, 0, 0, box.w, box.h);
  globeKeptKey = key;
  globeKeptGround = ground;
  return ground;
}

/*
 * The floor drawn flat on a larger canvas than the screen - tilting brings
 * more of the far distance into view than a flat picture holds - and then
 * laid back onto the screen one strip at a time.
 */
function groundTilted(box, now) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const room = turning() ? 2.2 : 1.6;
  const wide = box.w * room, tall = box.h * 2;
  if (flatMap.width !== Math.round(wide * dpr) || flatMap.height !== Math.round(tall * dpr)) {
    flatMap.width = Math.round(wide * dpr);
    flatMap.height = Math.round(tall * dpr);
  }
  flatCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Sea rather than night, for the reason given above groundFlat.
  seaInk(flatCtx, { w: wide, h: tall });
  flatCtx.fillRect(0, 0, wide, tall);

  const big = { w: wide, h: tall };
  const real = ctx;
  ctx = flatCtx;
  flatCtx.save();
  const S = spin();
  if (S) {
    flatCtx.translate(wide / 2, tall / 2);
    flatCtx.rotate(TUNE.turn * Math.PI / 180);
    flatCtx.translate(-wide / 2, -tall / 2);
  }
  const ground = drawGround(big);
  drawWater(big, now);
  drawRoads(big);
  if (chosen) drawLit(big, chosen, 0.16);
  else if (hovered) drawLit(big, hovered, 0.1);
  flatCtx.restore();
  ctx = real;

  // Turned but not leaned: the middle of that canvas is the picture.
  if (!tilting()) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(flatMap,
      (wide / 2 - box.w / 2) * dpr, (tall / 2 - box.h / 2) * dpr,
      box.w * dpr, box.h * dpr, 0, 0, box.w, box.h);
    return ground;
  }

  const L = lean(box);
  ctx.imageSmoothingEnabled = false;
  const step = 3;
  for (let v = -tall / 2; v < tall / 2; v += step) {
    const z = L.h - v * L.sin, zNext = L.h - (v + step) * L.sin;
    if (z < 1 || zNext < 1) continue;
    const k = L.h / z, kNext = L.h / zNext;
    const y = box.h / 2 + v * L.cos * k;
    const yNext = box.h / 2 + (v + step) * L.cos * kNext;
    if (yNext < 0 || y > box.h) continue;
    const from = box.w / k;
    if (from > wide) continue;                       // further out than we drew
    ctx.drawImage(flatMap,
      (wide / 2 - from / 2) * dpr, (tall / 2 + v) * dpr, from * dpr, step * dpr,
      0, y, box.w, Math.max(1, yNext - y));
  }
  return ground;
}

/*
 * The next frame is asked for before this one is drawn.
 *
 * With the request at the end, anything that threw on the way down stopped
 * the map for good - one bad number in one frame and the realm froze
 * half-drawn, which is indistinguishable from the page having crashed. Asked
 * for first, a bad frame is a bad frame and the next one is fine.
 */

/*
 * Fitting itself to a frame that is still growing.
 *
 * The atlas can be embedded in a box that changes size - a panel on the way
 * in that opens out to the whole page over half a second. Fitting once at
 * the start of that is fitting to the small box; so the host says "settle",
 * and the atlas re-fits itself and follows the box out.
 *
 * Counted in frames, not in milliseconds, and that is the whole trick. A
 * deadline is only met if frames happen to be drawn before it passes, and
 * the half second a panel takes to open is also the half second the atlas
 * spends fetching and decoding the ground for a box that just quadrupled -
 * so the window can go by with no frame drawn in it at all, and then the
 * settle never happens. A count comes off one frame at a time, so it cannot
 * be skipped however busy the browser is, and a slow machine simply takes
 * longer over it.
 *
 * It also comes in past him. A short frame puts the opening view below the
 * distance he starts at, so in a letterbox panel he is most of the picture -
 * which is a fine thing to meet on the way in to a map and no use at all
 * once you are trying to read one. Coming to rest just inside his distance
 * leaves the planet and takes him out of it, whatever shape the box is.
 */
let settleFor = 0;                       // frames left to keep fitting for
window.addEventListener('message', event => {
  const said = event.data;
  if (!said || said.rotmg !== 'settle') return;
  const frames = Math.max(1, Math.min(240, Math.round(Number(said.frames) || 48)));
  settleFor = Math.max(settleFor, frames);
});

function settleInto(box) {
  /*
   * Whatever zone was picked goes with it. The panel is a sidebar in a frame
   * that is about to be a different size, and a panel left open across that
   * is a panel covering a third of a map nobody asked it to cover.
   */
  shutPanel();
  fit();
  const least = floorZoom(box);
  const past = least * ORYX_FROM * 1.06;
  if (want.scale < past) want.scale = past;
  /*
   * And stepped past him rather than eased past him.
   *
   * Easing towards a zoom he is not in still draws him for the third of a
   * second it takes to get there, and a frame opening out is exactly when
   * somebody is looking. The view is floored at his distance for as long as
   * the settle lasts, so he is never on a drawn frame; what makes it a zoom
   * rather than a jump is the box itself growing under it, which re-fits
   * every frame and takes the planet up with it.
   */
  if (view.scale < past) view.scale = past;
}

function frame(now) {
  requestAnimationFrame(frame);
  /*
   * Never negative. Everything downstream of this multiplies by it - the
   * easing, the walk home, the creatures' step - so a clock that went
   * backwards would drive all of them backwards with it.
   */
  const delta = Math.max(0, Math.min(0.1, (now - last) / 1000));
  last = now;
  /*
   * The view eases to where it was asked to go rather than jumping.
   *
   * The distance closes by the same fraction every second, so it is quick
   * while there is a long way to go and slow as it arrives. Position is eased
   * straight and the zoom by ratio: halfway between one tile to the pixel and
   * a hundred is ten, not fifty, and easing the zoom straight spends most of
   * the movement almost stationary at the far end.
   */
  const ease = Math.min(1, delta * 5.5);
  view.x += (want.x - view.x) * ease;
  view.y += (want.y - view.y) * ease;
  if (view.scale > 0 && want.scale > 0) {
    const apart = want.scale / view.scale;
    view.scale *= Math.abs(apart - 1) < 1e-4 ? 1 : Math.pow(apart, ease);
  } else view.scale = want.scale;
  // Whatever else happens, the world has a positive size.
  if (!(view.scale > 0.001)) view.scale = 0.02;
  if (!(want.scale > 0.001)) want.scale = 0.02;
  const box = size();
  if (settleFor > 0) { settleFor--; settleInto(box); }
  keepInSight(box, delta);
  warmAhead(box);
  ctx.fillStyle = '#070a10';
  ctx.fillRect(0, 0, box.w, box.h);
  drawSpace(box, now);
  drawOryxBehind(box, now);

  /*
   * Leaning is the only thing that flattens the world - it is a different
   * camera, and the two do not compose. Turning does not: the world turns
   * with it.
   */
  let ground;
  if (tilting()) ground = groundTilted(box, now);
  else if (roundWorld(box)) ground = groundGlobe(box, now);
  else if (turning()) ground = groundTilted(box, now);
  else ground = groundFlat(box, now);
  stepLife(delta);
  const close = drawThings(box, now);
  const living = close ? close.living : drawLife(box);
  const marks = drawLandmarks(box);
  drawBeacons(box, now);
  drawNames(box);
  stepSky(delta, box);
  stepBirds(delta);
  drawBirds(box);
  drawSky(box, now);
  drawOryxHands(box, now);

  if (pointer) {
    const t = toTile(pointer.x, pointer.y, box);
    const here = atTile(t.x, t.y);
    hovered = here ? here.zone : 0;
    hoveredBeacon = view.scale >= BEACON_NEAR
      ? beaconUnder(pointer.x, pointer.y, box) : null;
    const zone = zoneById.get(hovered);
    whereAt.textContent = 'tile ' + Math.floor(t.x) + ', ' + Math.floor(t.y)
      + '   z' + ground.z + '   ' + ground.drawn + ' chunks   ' + living + ' alive   '
      + marks + ' set pieces';
    zoneAt.textContent = zone ? zone.name : (here && here.biome === A.mask.sea ? 'open water' : '');
    canvas.style.cursor = (zone || hoveredBeacon) ? 'pointer' : 'crosshair';
  }
}

/* ---------------- getting about ---------------- */
/*
 * Fitting the realm, not the strays.
 *
 * The recorded ground reaches a long way past the realm proper - a corner of
 * somewhere else, a handful of tiles from a stray moment - and fitting to all
 * of it left the realm a postage stamp in the middle of nothing. The focus is
 * the box round the places big enough to be places, which is where the realm
 * actually is.
 */
/*
 * Fitting shows the world.
 *
 * Fitting the island alone put its coasts against the edges of the window,
 * which on a globe means the world runs off the screen in every direction
 * and you cannot see that it is one. The disc is what is fitted now; the
 * island is most of it.
 */
/*
 * The disc is two radii across, and it wants a little air round it.
 *
 * A window of no size has to be survived rather than divided by. The atlas is
 * opened inside a frame that is hidden until its tab is asked for, so the
 * first fit can happen while the canvas measures nothing at all - and
 * `box.h - 34` is then negative, which made the scale negative, which made
 * the radius of the world negative. Everything downstream of that is
 * nonsense, and a negative radius handed to arc() threw once a frame.
 */
function fit() {
  const home = homeView(size());
  want.x = home.x; want.y = home.y; want.scale = home.scale;
}
/*
 * The wheel.
 *
 * A notch used to be a fifth again and it was applied to the view itself, so
 * every click of it was a jump and four of them took you the whole way from
 * the ground to the far side of the sky. Now a notch is a tenth, and it moves
 * only where the view is *going* - the view walks there over the next few
 * frames of its own accord. Rolling quickly still crosses the same distance,
 * because the notches pile onto a target that is already ahead of you, but it
 * arrives as one movement rather than as a series of steps.
 *
 * How far a notch is worth is taken from the event rather than assumed. A
 * wheel reports a hundred or so at a time and a trackpad reports a handful,
 * and treating both as one notch made the trackpad unusable.
 */
const WHEEL = 1.1;
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  const box = size();
  /*
   * Reckoned where the view is going rather than where it is, so that a quick
   * roll of several notches still leaves the thing under the pointer under
   * the pointer when it all settles.
   */
  const keep = { x: view.x, y: view.y, scale: view.scale };
  view.x = want.x; view.y = want.y; view.scale = want.scale;
  const under = toTile(event.offsetX, event.offsetY, box);
  const notch = Math.max(-1.5, Math.min(1.5, event.deltaY / 100));
  view.scale = want.scale = Math.max(floorZoom(box),
    Math.min(40, want.scale * Math.pow(WHEEL, -notch)));
  const after = toTile(event.offsetX, event.offsetY, box);
  /*
   * Keeping the thing under the pointer under the pointer, when there is
   * one.
   *
   * Past the limb of the world there is no tile under the pointer and the
   * projection says so by answering with nothing - which went straight
   * into the middle of the view, and a view with no number for a middle
   * draws no ground, no things and no weather. Standing right back, the
   * whole outer half of the window is off the world and Oryx's hands are
   * out there in it, so a roll of the wheel anywhere over a hand blacked
   * the map out until the page was reloaded.
   *
   * With nothing under the pointer there is nothing to hold in place, so
   * the zoom simply happens about the middle of the view.
   */
  const held = Number.isFinite(under.x) && Number.isFinite(under.y)
    && Number.isFinite(after.x) && Number.isFinite(after.y);
  if (held) {
    want.x += under.x - after.x;
    want.y += under.y - after.y;
  }
  walkingHome = false;                   // the wheel is a hand on it too
  resting = 0;
  view.x = keep.x; view.y = keep.y; view.scale = keep.scale;
}, { passive: false });

let from = null, moved = 0;
canvas.addEventListener('pointerdown', event => {
  from = { x: event.offsetX, y: event.offsetY, vx: view.x, vy: view.y };
  moved = 0;
  canvas.classList.add('drag');
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  pointer = { x: event.offsetX, y: event.offsetY };
  if (!from) return;
  moved += Math.abs(event.movementX) + Math.abs(event.movementY);
  /*
   * The world is dragged in the frame it is drawn in. Turned a quarter, a
   * pull to the right walked the map upwards, because the pull was being
   * read in the screen's frame and applied in the world's.
   */
  let dx = (event.offsetX - from.x) / view.scale;
  let dy = (event.offsetY - from.y) / view.scale;
  const S = spin();
  if (S) { const nx = dx * S.cos + dy * S.sin; dy = -dx * S.sin + dy * S.cos; dx = nx; }
  view.x = want.x = from.vx - dx;
  view.y = want.y = from.vy - dy;
});
canvas.addEventListener('pointerup', event => {
  canvas.classList.remove('drag');
  const dragged = moved > 5;
  from = null;
  if (dragged) return;
  // A click, not a drag: open what is under it, or close what is open.
  const box = size();
  const t = toTile(event.offsetX, event.offsetY, box);
  // A beacon is a smaller target than the ground under it, so it is tried
  // first, and with a margin that does not shrink to nothing when zoomed out.
  const near = beaconUnder(event.offsetX, event.offsetY, box);
  if (near) { openBeacon(near); return; }
  const zone = zoneOf(t.x, t.y);
  if (zone) openZone(zone); else shutPanel();
});
canvas.addEventListener('pointerleave', () => { pointer = null; hovered = 0; hoveredBeacon = null; });
canvas.addEventListener('dblclick', () => { shutPanel(); fit(); });
addEventListener('resize', () => { if (!from) size(); });
addEventListener('keydown', event => {
  if (event.key === 'Escape') { shutPanel(); return; }
  const on = event.target;
  if (on && (on.tagName === 'INPUT' || on.tagName === 'TEXTAREA')) return;
  if (event.key === 'a' || event.key === 'A') { turnBy(-TURN_STEP); event.preventDefault(); }
  else if (event.key === 'e' || event.key === 'E') { turnBy(TURN_STEP); event.preventDefault(); }
});

/*
 * How many people have been here.
 *
 * The map is a folder of files on a static host: nothing of ours runs when
 * somebody opens it, so nothing of ours can count. The only way to have a
 * number is to ask something that is running somewhere, and this asks Abacus,
 * which keeps a counter under a name and hands it back. It is told nothing
 * but the name - no page, no referrer we add, nothing about who is asking -
 * and if it is down or blocked the line simply never appears.
 *
 * Two names: one that has always been counting, and one per day. And counted
 * once a day per browser rather than once a page load, because the question
 * is how many people came and not how many times somebody pressed reload -
 * so the day already counted is remembered here, and every later visit that
 * day reads the numbers without adding to them.
 */
const ABACUS = 'https://abacus.jasoncameron.dev/';
function countVisitors() {
  const day = new Date().toISOString().slice(0, 10);
  let counted = null;
  try { counted = localStorage.getItem('atlas-counted'); } catch (no) { counted = null; }
  const first = counted !== day;
  if (first) { try { localStorage.setItem('atlas-counted', day); } catch (no) { /* private */ } }

  const box = document.getElementById('seen');
  const ask = (key, into) => fetch(ABACUS + (first ? 'hit' : 'get') + '/rotmg-realm-atlas/' + key)
    .then(r => r.ok ? r.json() : null)
    .then(said => {
      if (!said || typeof said.value !== 'number') return;
      const cell = document.getElementById(into);
      if (cell) cell.textContent = said.value.toLocaleString();
      if (box) box.hidden = false;
    })
    .catch(() => { /* offline, blocked, or the service is away: say nothing */ });
  ask('all', 'seenAll');
  ask('d' + day.replace(/-/g, ''), 'seenToday');
}
countVisitors();

fit();
view.scale = want.scale; view.x = want.x; view.y = want.y;
requestAnimationFrame(frame);
</script>
