<!--
  Three panels, each a card like every other panel on this site: what there is
  to wear on the left, what it looks like in the middle, what to dye it with on
  the right.

  Everything here is written down. Two later passes used to find their own
  places at runtime - one located the stage by measuring boxes until it found
  one about the size of the canvas, the other located the heading by comparing
  every node's text to the skin's name - and then hid the markup they were
  duplicating by searching for the words "wasd" and "attack speed". That is
  gone: the controls they built are below, with ids, and the blocks they
  injected have containers to render into.
-->
<header class="viewer-head"><b>Realm of the Mad God</b><small>local skin viewer · client data only</small></header>
<main>

  <section class="panel catalogue" aria-label="Skins">
    <div id="skinResizeGrip"
      class="panel-resize-grip panel-resize-grip-skins"
      role="separator"
      aria-orientation="vertical"
      tabindex="0"
      title="Drag to resize · double-click to reset"></div>
    <header class="panel-title">
      <b>Skins</b>
      <span id="count"></span>
    </header>
<div class="panel-body">
      <input id="search" class="panel-search" placeholder="Search skins">

      <div class="filter-box skin-browse-box">
        <div class="filter-box-head">
          <span>Browse by</span>
          <div class="browse-mode-switch" role="group" aria-label="Browse skins by">
            <button type="button" data-skin-filter-mode="class">Class</button>
            <button type="button" data-skin-filter-mode="family">Family</button>
          </div>
        </div>

        <div id="skinClassFilter" class="skin-filter-panel">
          <div id="classes" class="class-grid"></div>
        </div>

        <div id="skinFamilyFilter" class="skin-filter-panel" hidden>
          <div id="families" class="filter-chips"></div>
        </div>
      </div>

      <div id="skins" class="card-list browse-grid"></div>
    </div>
  </section>

  <section class="panel stage-panel" aria-label="Sandbox">
    <!--
      The card says what you are looking at, the way a card on any other page
      does. This was an h1 under the stage, which is where the space ran out.
    -->
    <header class="panel-title stage-title">
      <span class="stage-named"><b id="name"></b><small id="meta"></small></span>
      <span class="stage-tools">
        <span class="world-mode" role="group" aria-label="Sandbox background">
          <button type="button" data-world-mode="studio">Studio</button>
          <button type="button" data-world-mode="beach">Beach</button>
        </span>
        <span id="worldModeHint"></span>
        <span id="zoomValue" class="stage-zoom"></span>
        <button type="button" id="resetWorld">Reset</button>
      </span>
    </header>

    <!-- What the index holds about the three things chosen right now. -->
    <div id="selectedIndex" class="selected-index selected-index-top" aria-label="Selected objects in the Index"></div>

    <section class="combo-workbench combo-workbench-top" aria-label="Saved skin combinations">
      <span class="combo-workbench-title">
        <strong>Saved combos</strong>
        <small id="comboCount">0 saved</small>
      </span>
      <div id="comboShelf" class="combo-shelf"></div>
    </section>

    <!--
      The stage takes whatever room is left and the canvases are sized to it,
      rather than being 640 by 420 whatever the window is. app.js watches this
      box and resizes all three to match.
    -->
    <div class="stage-body" id="stageBody">
      <div class="sandbox-stack">
        <canvas id="worldBg" width="640" height="420" aria-hidden="true"></canvas>
        <canvas id="canvas" width="640" height="420" tabindex="0" aria-label="Skin sandbox"></canvas>
        <canvas id="fxCanvas" width="640" height="420" aria-hidden="true"></canvas>
        <div id="missing" hidden>missing sprite frame</div>
      </div>
    </div>

    <div class="sandbox-bar" id="sandboxBar">
      <div class="sandbox-help">
        <span><b>WASD</b> move · <b>mouse</b> aim · <b>hold click</b> attack · <b>wheel</b> zoom</span>
        <button type="button" id="saveCombo" class="save-combo sandbox-save-combo">
          ☆ Save combo
        </button>
      </div>

      <label class="sandbox-speed">
        <strong>Attack speed</strong>
        <input id="attackSpeed" type="range" min="0.25" max="4" step="0.05" value="1" aria-label="Attack speed">
        <output id="attackSpeedValue"></output>
      </label>
    </div>

  </section>

  <section class="panel dyes" aria-label="Dyes">
    <div id="dyeResizeGrip"
      class="panel-resize-grip panel-resize-grip-dyes"
      role="separator"
      aria-orientation="vertical"
      tabindex="0"
      title="Drag to resize · double-click to reset"></div>
    <header class="panel-title">
      <b>Dyes</b>
      <span id="dyeCount"></span>
    </header>
<div class="panel-body">
      <div class="filter-box dye-target-box">
        <div class="filter-box-head">
          <span>Apply to</span>
        </div>
        <div id="dyeSlots" class="dye-target-switch"></div>
      </div>

      <div class="dye-tools">
        <input id="dyeSearch" placeholder="Search dyes">
        <button type="button" id="clearDye">Clear</button>
      </div>

      <div class="filter-box dye-type-box">
        <div class="filter-box-head">
          <span>Type</span>
        </div>
        <div id="dyeCategories" class="filter-chips"></div>
      </div>

      <div id="dyeList" class="card-list browse-grid"></div>
    </div>
  </section>

</main>
