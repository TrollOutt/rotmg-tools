# Publishes the calculator to GitHub Pages.
#
# The site is rebuilt from source on every push, so what visitors get can never
# drift from what is in the repository. The test suite runs first: a wrong
# probability does not crash, so this is the only thing that would catch one
# before it is published.
#
# One-time setup in the repository: Settings -> Pages -> Source: GitHub Actions.
#
# Branches and pull requests are tested by ci.yml; this workflow publishes main.
#
# Each action is pinned to a full commit SHA, with its tag in a comment
# (ROT-A-10); .github/dependabot.yml keeps the pins up to date.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (npm ci, tests, build) only reads the
# repository. Only the deploy job may write Pages and ask for an OIDC token.
permissions:
  contents: read

# Let a running deployment finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # configure-pages reads the site's settings; nothing in this job writes.
    permissions:
      contents: read
      pages: read
    steps:
      # No step pushes or fetches with git afterwards, and publishing goes
      # through the Pages artifact and the deploy job's own token, so the
      # checkout token is not left in .git/config for npm test to read.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Install the locked development dependencies only for the type check.
      # The site and its build remain plain Node with no runtime dependencies.
      - name: Install type checking tools
        run: npm ci --ignore-scripts

      - name: Parse every page script and check the translations
        run: npm run lint

      - name: Check progression types
        run: npm run typecheck

      - name: Verify the calculation engine
        run: npm test

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Python pipeline unit tests
        run: npm run test:python

      - name: Build the page
        run: npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
