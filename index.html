<!doctype html>
<meta charset="utf-8">
<title>RotMG Enchant Calculator</title>
<!--
  A signpost, not the application.

  The site is meant to be published by .github/workflows/pages.yml, which uploads
  docs/ and therefore puts the calculator at the root of the domain. While Pages
  is instead set to "deploy from a branch", the whole repository is published as
  it stands and the root would otherwise show the README, so this forwards to
  where the built page actually is.

  Under the Actions deployment only docs/ is published, so this file is not part
  of the site at all and costs nothing.
-->
<meta http-equiv="refresh" content="0; url=./docs/">
<link rel="canonical" href="https://trolloutt.github.io/docs/">
<style>
  html { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: .75rem;
         text-align: center; background: #0d0c13; color: #d8d3e6;
         font: 16px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; }
  a { color: #ca7aff; }
</style>
